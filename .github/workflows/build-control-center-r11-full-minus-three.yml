name: Build DJAEGER Control Center v0.12.1-r11 Full Minus Three
on:
  push:
    branches: [codex/v0.12.1-r11-full-minus-hud-launcher-freeform]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate full r10.2 baseline then surgical r11 cut
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          body='\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n'; Path('/tmp/r7.py').write_text(body)
          PY
          python3 /tmp/r7.py
          python3 scripts/r9_cutover_repository.py
          python3 scripts/r9_integrate_bug_health.py
          python3 scripts/r10_integrate_manual_refresh.py
          python3 scripts/r10_1_idle_semantics.py
          python3 scripts/r10_2_freshness_semantics.py
          python3 scripts/r11_surgical_remove_ui.py
      - name: Preserve-feature regression gates
        run: |
          set -euo pipefail
          M=control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          R=control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          A=control-center-r2/app/src/main/AndroidManifest.xml
          grep -q 'versionName = "0.12.1-r11"' control-center-r2/app/build.gradle.kts
          grep -q 'setUserMode' "$M"
          grep -q 'saveGeminiKey' "$M"
          grep -q 'deleteGeminiKey' "$M"
          grep -q 'geminiChat' "$M"
          grep -q 'authoritySyncStatus' "$M"
          grep -q 'kernelCapabilitySummary' "$M"
          grep -q 'maturityAudit' "$M"
          grep -q 'manualRefresh++' "$M"
          grep -q 'NetworkCard' "$M"
          grep -q 'ConsolidatedSnapshotReader' "$R"
          ! grep -q 'SYSTEM_ALERT_WINDOW' "$A"
          ! grep -R -E 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}' control-center-r2/app/src control-center-r2/app/build.gradle.kts
          echo R11_FULL_FEATURE_PRESERVATION=PASS
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r11
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r11.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r11.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r11.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/DJAEGER-Control-Center-v0.12.1-r11.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r11.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r11.apk > output/SHA256SUMS.txt
          rm output/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r11
          path: output/*
          if-no-files-found: error
          retention-days: 30
