name: Build RN8Pro AutoCut Monitor

on:
  push:
    branches: [ main ]
    paths:
      - 'rn8pro-autocut-monitor/**'
      - '.github/workflows/build-rn8pro-autocut-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Safety assertions
        run: |
          set -euo pipefail
          ! grep -R "/sys/class/power_supply" rn8pro-autocut-monitor/app/src/main/java
          ! grep -R "Runtime.getRuntime().exec\|ProcessBuilder" rn8pro-autocut-monitor/app/src/main/java
          grep -R "com.djaeger.autocut.STATUS" rn8pro-autocut-monitor/app/src/main
          grep -R "setOngoing(true)" rn8pro-autocut-monitor/app/src/main/java
          grep -R "input_suspend" rn8pro-autocut-monitor/app/src/main/java

      - name: Build installable APK
        working-directory: rn8pro-autocut-monitor
        run: gradle :app:assembleDebug --stacktrace

      - name: Package artifact
        run: |
          mkdir -p out
          cp rn8pro-autocut-monitor/app/build/outputs/apk/debug/app-debug.apk              out/DJAEGER-AutoCut-Monitor-v1.0-RN8Pro.apk
          sha256sum out/DJAEGER-AutoCut-Monitor-v1.0-RN8Pro.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-AutoCut-Monitor-v1.0-RN8Pro
          path: |
            out/DJAEGER-AutoCut-Monitor-v1.0-RN8Pro.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
