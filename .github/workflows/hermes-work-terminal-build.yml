name: DJAEGER WORK Native Dashboard APK

on:
  push:
    branches:
      - djaeger-work-native-v1.2.5
    paths:
      - 'hermes-work-terminal/**'
      - '.github/workflows/hermes-work-terminal-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore and approved logo
        shell: bash
        run: |
          set -euo pipefail
          base64 -d hermes-work-terminal/signing/hermes_work_terminal.jks.b64 > hermes-work-terminal/app/hermes_work_terminal.jks
          mkdir -p hermes-work-terminal/app/src/main/res/drawable
          cat hermes-work-terminal/logo-b64/logo.*.b64 | base64 -d > hermes-work-terminal/app/src/main/res/drawable/djaeger_logo.png
          echo "db60ad3b00744246520b53a40d3e28c229496591cd41d3feb5c8ae1ab474e6b7  hermes-work-terminal/app/src/main/res/drawable/djaeger_logo.png" | sha256sum -c -

      - name: Verify feature preservation
        shell: bash
        run: |
          set -euo pipefail
          SRC=hermes-work-terminal/app/src/main/java/com/hermes/workdashboard/MainActivity.java
          python3 - "$SRC" <<'PY'
          import sys
          p=sys.argv[1]
          s=open(p,encoding='utf-8').read()
          required=[
            'String[] labels = {"WORK", "RESEARCH", "PLANNER", "INSIGHTS", "SYSTEM", "UPDATE"};',
            'case 0: buildWork(body);',
            'case 1: buildResearch(body);',
            'case 2: buildPlanner(body);',
            'case 3: buildInsights(body);',
            'case 4: buildSystem(body);',
            'case 5: buildUpdate(body);',
            'private void buildWork(',
            'private void buildResearch(',
            'private void buildPlanner(',
            'private void buildInsights(',
            'private void buildSystem(',
            'private void buildUpdate(',
            '/api/work/run-research',
            '/api/work/brief',
            '/api/work/channel',
            '/api/work/knowledge',
            '/api/work/recovery',
            'DJAEGER WORK',
            'showPage(currentPage)'
          ]
          missing=[x for x in required if x not in s]
          if missing:
              print('Missing preserved contracts:', missing)
              raise SystemExit(1)
          print('Six menus and original page builders preserved.')
          PY
          grep -Fq 'applicationId "com.hermes.workdashboard"' hermes-work-terminal/app/build.gradle
          grep -Fq 'versionName "1.2.5"' hermes-work-terminal/app/build.gradle

      - name: Build signed release APK
        working-directory: hermes-work-terminal
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=hermes-work-terminal/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "package: name='com.hermes.workdashboard'" /tmp/badging.txt
          grep -Fq "versionName='1.2.5'" /tmp/badging.txt
          grep -Fq "application-label:'DJAEGER WORK'" /tmp/badging.txt
          cp "$APK" DJAEGER_WORK_Dashboard_v1.2.5.apk
          sha256sum DJAEGER_WORK_Dashboard_v1.2.5.apk | tee SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-WORK-Native-v1.2.5-APK
          path: |
            DJAEGER_WORK_Dashboard_v1.2.5.apk
            SHA256.txt
          retention-days: 30
