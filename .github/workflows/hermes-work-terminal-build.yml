name: HERMES WORK Control Center Dashboard APK

on:
  push:
    branches:
      - hermes-work-dashboard-v1.1
    paths:
      - 'hermes-work-terminal/**'
      - '.github/workflows/hermes-work-terminal-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore signing keystore
        run: base64 -d hermes-work-terminal/signing/hermes_work_terminal.jks.b64 > hermes-work-terminal/app/hermes_work_terminal.jks
      - name: Build signed release APK
        working-directory: hermes-work-terminal
        run: gradle :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp hermes-work-terminal/app/build/outputs/apk/release/app-release.apk HERMES_WORK_Dashboard_v1.2.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HERMES-WORK-Dashboard-v1.2.3-APK
          path: HERMES_WORK_Dashboard_v1.2.3.apk
          retention-days: 30
