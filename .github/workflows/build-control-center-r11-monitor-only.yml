name: Build DJAEGER Monitor v0.12.1-r11
on:
  push:
    branches: [codex/v0.12.1-r11-monitor-only]
    paths:
      - '.github/workflows/build-control-center-r11-monitor-only.yml'
      - 'scripts/r11_monitor_only.py'
      - 'control-center-r2/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate proven r10.2 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          body='\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n'; compile(body,'/tmp/r7.py','exec'); Path('/tmp/r7.py').write_text(body)
          PY
          python3 /tmp/r7.py
          python3 scripts/r9_cutover_repository.py
          python3 scripts/r9_integrate_bug_health.py
          python3 scripts/r10_integrate_manual_refresh.py
          python3 scripts/r10_1_idle_semantics.py
          python3 scripts/r10_2_freshness_semantics.py
          python3 scripts/r11_monitor_only.py
      - name: Monitor-only regression gates
        run: |
          set -euo pipefail
          M=control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          R=control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          A=control-center-r2/app/src/main/AndroidManifest.xml
          grep -q 'versionName = "0.12.1-r11-monitor-only"' control-center-r2/app/build.gradle.kts
          grep -q 'MONITOR • v0.12.1-r11 • R78 READ-ONLY' "$M"
          grep -q 'MONITOR-ONLY BOUNDARY' "$M"
          ! grep -q 'SYSTEM_ALERT_WINDOW' "$A"
          ! grep -E 'setUserMode\(|saveGeminiKey\(|deleteGeminiKey\(|geminiChat\(' "$M"
          ! grep -E 'suspend fun (setUserMode|saveGeminiKey|deleteGeminiKey|geminiChat|geminiChatClear)\(' "$R"
          ! grep -R -E 'startActivity.*(game|freeform)|SYSTEM_ALERT_WINDOW|TYPE_APPLICATION_OVERLAY' control-center-r2/app/src/main || true
          python3 - <<'PY'
          from pathlib import Path
          bad=['/sys/','iptables','nft ','ip route','setprop net.']
          for p in Path('control-center-r2/app/src/main').rglob('*.kt'):
              t=p.read_text()
              # snapshot reader may contain path strings only if read-only; any shell redirection to sensitive nodes is forbidden.
              for x in bad:
                  if x in t and ('>'+x in t or 'tee '+x in t): raise SystemExit('R11_MUTATION='+str(p)+':'+x)
          print('R11_MONITOR_ONLY_GATE=PASS')
          PY
          ! grep -R -E 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}' control-center-r2/app/src control-center-r2/app/build.gradle.kts
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify and audit
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-monitor-r11
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r11.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Monitor, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; UNSIGNED="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r11.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Monitor-v0.12.1-r11.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/DJAEGER-Monitor-v0.12.1-r11.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Monitor-v0.12.1-r11.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Monitor-v0.12.1-r11.apk > output/SHA256SUMS.txt
          rm output/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Monitor-v0.12.1-r11
          path: output/*
          if-no-files-found: error
          retention-days: 30
