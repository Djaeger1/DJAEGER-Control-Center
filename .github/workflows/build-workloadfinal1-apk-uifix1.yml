name: Build WORKLOADFINAL1 APK UIFIX1
on:
  push:
    branches: [codex/workloadfinal1-apk-uifix1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}

      - name: Rebuild exact WORKLOADFINAL1 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py; do python3 scripts/$s; done
          python3 scripts/r34_rebuild3_agent_full_hardware_truth.py
          python3 scripts/r35_rebuild3_lang2_mwfix1.py
          python3 scripts/r36_rebuild3_lang3_math1_sync1.py
          python3 scripts/r37_sync2_session_truth_ui_order.py
          python3 scripts/r38_mwfix2_sync3.py
          python3 scripts/r39_attr1_sync4.py
          python3 scripts/r40_hk1_sysfs1_ccsync1.py
          python3 scripts/r41_loopfix1_ccmatch1.py
          python3 scripts/r42_gamereg1.py
          python3 scripts/r43_sharedint1.py
          python3 scripts/r44_hermescloud1.py
          python3 scripts/r45_workloadfinal1.py
          python3 scripts/r46_workloadfinal1_overview_order_fix.py
          cp -a control-center-r2 /tmp/workloadfinal1-before-uifix

      - name: Apply APK-only UI fix
        run: |
          set -euo pipefail
          python3 scripts/r47_workloadfinal1_apk_uifix1.py

      - name: Baseline synchronization and regression gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('control-center-r2'); old=Path('/tmp/workloadfinal1-before-uifix')
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before={p.relative_to(old).as_posix():h(p) for p in old.rglob('*') if p.is_file()}
          after={p.relative_to(root).as_posix():h(p) for p in root.rglob('*') if p.is_file()}
          assert set(before)==set(after)
          changed=sorted(k for k in before if before[k]!=after[k])
          allowed=sorted([
            'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt',
            'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt',
          ])
          assert changed==allowed,(changed,allowed)
          B=(root/'app/build.gradle.kts').read_text()
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          assert 'versionCode = 12261' in B
          assert '0.12.1-rebuild3-hk1-sysfs1-ccsync1-loopfix1-gamereg1-sharedint1-hermescloud1-workloadfinal1' in B
          assert 'VC129637 / VC12261' in M
          assert 'CONTROL CENTER • REBUILD3' not in M
          assert 'CONTROL CENTER' in M
          assert 'holdAge in 1L..10L' in R
          assert 'held=true' in R
          assert 'ProcessBuilder("su"' not in M
          print('REGRESSION_GATE=PASS')
          print('CHANGED_FILES='+','.join(changed))
          print('MODULE_CHANGE=NONE')
          print('PAIR=VC129637/VC12261')
          print('VERSION_IDENTITY=PRESERVED')
          PY

      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Sign verify and prepare APK
        run: |
          set -euo pipefail
          rm -rf output-uifix1
          mkdir -p output-uifix1
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$U" output-uifix1/aligned.apk
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-workloadfinal1-uifix1
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/workloadfinal1-uifix1.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER WORKLOADFINAL1 UIFIX1, O=DJAEGER, C=ID'
          APK=output-uifix1/DJAEGER-Control-Center-v0.12.1-WORKLOADFINAL1-UIFIX1.apk
          "$BT/apksigner" sign --ks /tmp/workloadfinal1-uifix1.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$APK" output-uifix1/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > output-uifix1/APK_VERIFY.txt
          unzip -t "$APK" > output-uifix1/APK_ZIP_TEST.txt
          sha256sum "$APK" > output-uifix1/SHA256.txt
          printf '%s\n' \
            'BASELINE=WORKLOADFINAL1' \
            'MODULE_CHANGED=NO' \
            'MODULE_VERSION_CODE=129637' \
            'CONTROL_CENTER_VERSION_CODE=12261' \
            'CONTROL_CENTER_VERSION_NAME=0.12.1-rebuild3-hk1-sysfs1-ccsync1-loopfix1-gamereg1-sharedint1-hermescloud1-workloadfinal1' \
            'HEADER=CONTROL CENTER' \
            'NETWORK_TRANSIENT_LAST_VALID_HOLD=10s' \
            'NETWORK_HOLD_LABEL=EXPLICIT' \
            'CHANGED_SOURCE_FILES=MainActivity.kt,DjaegerRepository.kt' \
            'MODULE_FLASH_REQUIRED=NO' > output-uifix1/BUILD_REPORT.txt
          rm output-uifix1/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: djaeger-workloadfinal1-apk-uifix1
          path: output-uifix1/
          if-no-files-found: error
          retention-days: 30
