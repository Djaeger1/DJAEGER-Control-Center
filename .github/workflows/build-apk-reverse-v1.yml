name: Build DJAEGER APK Reverse v0.1

on:
  push:
    branches:
      - build/apk-reverse-v1
    paths:
      - "apk-reverse-app/**"
      - ".github/workflows/build-apk-reverse-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: apk-reverse-app
        run: gradle test --stacktrace

      - name: Assemble debug APK
        working-directory: apk-reverse-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK structure
        run: |
          set -e
          APK="apk-reverse-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "com.djaeger.apkreverse" >/dev/null

      - name: Package artifact before runtime test
        if: always()
        run: |
          set -e
          APK="apk-reverse-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/DJAEGER-APK-Reverse-v0.1.0-debug.apk
          sha256sum out/DJAEGER-APK-Reverse-v0.1.0-debug.apk > out/SHA256SUMS.txt

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r apk-reverse-app/app/build/outputs/apk/debug/app-debug.apk || exit 1
            adb shell am force-stop com.djaeger.apkreverse || exit 1
            if ! adb shell am start -W -n com.djaeger.apkreverse/.MainActivity; then
              echo "AM_START_FAILED"
              adb logcat -d -t 500
              exit 1
            fi
            sleep 3
            echo "=== TOP ACTIVITY ==="
            adb shell dumpsys activity activities | grep -F "com.djaeger.apkreverse" || true
            echo "=== PROCESS ==="
            PID="$(adb shell pidof com.djaeger.apkreverse | tr -d '\r')"
            if test -z "$PID"; then
              echo "APK process not running; collecting logcat."
              adb logcat -d -t 500
              exit 1
            fi
            echo "EMULATOR_SMOKE_PASS pid=$PID"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-APK-Reverse-v0.1.0
          path: |
            out/DJAEGER-APK-Reverse-v0.1.0-debug.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
