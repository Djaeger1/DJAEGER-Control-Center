name: Build DJAEGER APK Reverse v0.2

on:
  push:
    branches:
      - build/apk-reverse-v1
    paths:
      - "apk-reverse-app/**"
      - ".github/workflows/build-apk-reverse-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: apk-reverse-app
        run: gradle test --stacktrace

      - name: Assemble debug APK
        working-directory: apk-reverse-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK structure
        run: |
          set -e
          APK="apk-reverse-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "package: name='com.djaeger.apkreverse'" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | grep -F "launchable-activity: name='com.djaeger.apkreverse.MainActivity'" >/dev/null

      - name: Package artifact before runtime test
        if: always()
        run: |
          set -e
          APK="apk-reverse-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/DJAEGER-APK-Reverse-v0.2.0-debug.apk
          sha256sum out/DJAEGER-APK-Reverse-v0.2.0-debug.apk > out/SHA256SUMS.txt

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-APK-Reverse-v0.2.0
          path: |
            out/DJAEGER-APK-Reverse-v0.2.0-debug.apk
            out/SHA256SUMS.txt
          if-no-files-found: error

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 300
          script: |
            adb install -r apk-reverse-app/app/build/outputs/apk/debug/app-debug.apk || exit 1
            adb shell am force-stop com.djaeger.apkreverse || exit 1
            START_OUT="$(adb shell am start -W -n com.djaeger.apkreverse/.MainActivity)"
            echo "$START_OUT"
            sleep 3
            ACTIVITY_STATE="$(adb shell dumpsys activity activities)"
            echo "$ACTIVITY_STATE" | grep -F "mResumedActivity: ActivityRecord" | grep -F "com.djaeger.apkreverse/.MainActivity" >/dev/null || exit 1
            echo "$ACTIVITY_STATE" | grep -F "processName=com.djaeger.apkreverse" >/dev/null || exit 1
            echo "$ACTIVITY_STATE" | grep -F "app=ProcessRecord" | grep -F "com.djaeger.apkreverse" >/dev/null || exit 1
            if adb logcat -d -t 500 | grep -F "FATAL EXCEPTION" | grep -F "com.djaeger.apkreverse" >/dev/null; then
              echo "FATAL_EXCEPTION_DETECTED"
              exit 1
            fi
            echo "EMULATOR_SMOKE_PASS activity=com.djaeger.apkreverse/.MainActivity"
