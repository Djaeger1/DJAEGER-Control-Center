name: DJAEGER AI THOUGHT MEMORY Terminal Tests

on:
  push:
    branches: [fix/thought-memory-v1.1.7-hotfix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djaeger-ai-thoughtmemory-terminal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terminal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify installed-pair compatibility
        run: |
          set -euo pipefail
          PROP=observer-next/module/module.prop
          PUB=observer-next/module/bin/publisher.sh
          CTL=observer-next/module/bin/observerctl.sh
          grep -Fqx 'versionCode=210' "$PROP"
          grep -Fq '_expected_apk=111' "$PUB"
          grep -Fq 'EXPECTED_CONTROL_CENTER_VERSION_CODE=111' "$PUB"
          grep -Fq 'expected_apk=111' "$CTL"
          grep -Fq '[ "$module_code" = 210 ]' "$CTL"

      - name: Verify concise thought contract
        run: |
          set -euo pipefail
          PUB=observer-next/module/bin/publisher.sh
          grep -Fq '_thought_context="Game masih stabil di sekitar $_fps FPS, tetapi skin ${_skin_t}C mulai menekan kenyamanan."' "$PUB"
          grep -Fq 'ONE HERMES mempertahankan kondisi saat ini' "$PUB"
          grep -Fq 'opsi lebih dingin hanya dipilih jika panas meningkat tanpa merusak kestabilan frame.' "$PUB"
          ! grep -Fq 'Device Truth saat ini membaca sekitar' "$PUB"
          ! grep -Fq 'Suhu yang terbaca: skin' "$PUB"
          ! grep -Fq 'Clock aktif kira-kira' "$PUB"
          ! grep -Fq '_human_metrics' "$PUB"

      - name: Verify 100 MiB persistent memory contract
        run: |
          set -euo pipefail
          PUB=observer-next/module/bin/publisher.sh
          OBS=observer-next/module/bin/observer.sh
          LEARN=observer-next/module/bin/learner.sh
          grep -Fq 'MAX_BYTES=104857600' "$PUB"
          grep -Fq 'MEMORY_MAX_BYTES=104857600' "$OBS"
          grep -Fq 'MEMORY_RESERVE_BYTES=4194304' "$OBS"
          grep -Fq 'TOTAL_MEMORY_BYTES=$((SIZE+AUX_BYTES))' "$OBS"
          grep -Fq 'TELEMETRY_TARGET=$((MEMORY_MAX_BYTES-AUX_BYTES-MEMORY_RESERVE_BYTES))' "$OBS"
          grep -Fq 'OUTCOMES_MAX_BYTES=8388608' observer-next/module/bin/executor.sh
          grep -Fq 'OUTCOMES_RETAIN_BYTES=6291456' observer-next/module/bin/executor.sh
          grep -Fq 'sample_counts.tsv' "$OBS"
          grep -Fq 'LEARN_WINDOW_BYTES=8388608' "$LEARN"
          grep -Fq 'ANALYSIS_HISTORY="$TMPBASE.history"' "$LEARN"
          ! grep -Fq 'MAX_BYTES=3145728' "$PUB"
          ! grep -Fq 'if [ "$SIZE" -gt 3145728 ]' "$OBS"

      - name: Source isolation and backend tests
        run: |
          set -euo pipefail
          node isolation-check.js
          npm test
          A=DJAEGER; B=WORK; C=HERMES; D=railway; E=relay; F=AUTO; G=STUDIO; H=YOUTUBE; I=SCHEDULER
          for q in "${A}-${B}" "${A}_${B}" "${A} ${B}" "${C}-${B}" "${C}_${B}" "${C} ${B}" "${D}-${E}" "${F}_${G}" "${H}_${I}"; do
            if grep -R -I -i -F --exclude-dir=.git --exclude=isolation-check.js "$q" observer-next; then
              echo "FOREIGN_SOURCE_RESIDUE=$q" >&2
              exit 1
            fi
          done
          test -e observer-next/module/bin/executor.sh
          test ! -e observer-next/module/bin/agent_bus.sh
          grep -Fq 'CLOUD_HARDWARE_AUTHORITY=NONE' observer-next/tests/module_contract_test.sh
          for f in observer-next/module/*.sh observer-next/module/bin/*.sh; do
            [ "$f" = observer-next/module/bin/executor.sh ] && continue
            ! grep -Eq 'tee[[:space:]]+/sys/|>[[:space:]]*/sys/' "$f"
          done

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in observer-next/module/*.sh observer-next/module/bin/*.sh; do
            bash -n "$f"
          done

      - name: Contract and fake-sysfs terminal tests
        run: bash observer-next/tests/module_contract_test.sh

      - name: Confirm no release packaging
        run: |
          set -euo pipefail
          test ! -d out
          echo 'TERMINAL_TEST_ONLY=PASS'
          echo 'MODULE_BUILD=DISABLED'
          echo 'APK_BUILD=DISABLED'
          echo 'ARTIFACT_UPLOAD=DISABLED'
