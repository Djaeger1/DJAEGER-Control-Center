name: Build R78 Full Control Center Minus Three
on:
  push:
    branches: [codex/r78-full-control-center-minus-three-final]
    paths: ['.github/workflows/build-r78-final-minus-three.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: Rebuild full proven Control Center chain
        run: |
          rm -rf project && mkdir project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          cd project/DJAEGER_Control_Center
          python3 ../../scripts/build11_ai_bridge_patch.py
          python3 ../../scripts/build12_hardening_patch.py
          python3 ../../scripts/build14_profileinstaller_hardening_patch.py
          python3 ../../scripts/build15_evolution_hud_patch.py
          python3 ../../scripts/build16_game_turbo_experience_patch.py
          python3 ../../scripts/build17_game_turbo_polish_patch.py
          python3 ../../scripts/build18_game_turbo_compile_fix.py
          python3 ../../scripts/build19_game_turbo_service_rewrite.py
          python3 ../../scripts/build20_miui_game_turbo_authority_patch.py
          python3 ../../scripts/build21_djaeger_ai_kernel_sync_patch.py
          python3 ../../scripts/build22_hud_flicker_fix_patch.py
          python3 ../../scripts/build23_hud_compile_fix.py
          python3 ../../scripts/build41_v0121_latest_djaeger_sync.py
          python3 ../../scripts/build45_v0121_live_telemetry_safe.py
          python3 ../../scripts/build46_v0121_missing_telemetry_semantics.py
          python3 ../../scripts/build47_live_sample_timestamp.py
          sed -i 's/versionCode = [0-9][0-9]*/versionCode = 12178/' app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "0.12.1-r78-final"/' app/build.gradle.kts
      - name: Exact removal and preservation gates
        working-directory: project/DJAEGER_Control_Center
        run: |
          M=app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          R=app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          A=app/src/main/AndroidManifest.xml
          grep -q 'GEMINI CONVERSATION' "$M"
          grep -q 'ASK GEMINI' "$M"
          grep -q 'djaeger-ai mode ' "$R"
          grep -q 'djaeger-ai gemini-key-stdin' "$R"
          grep -q 'djaeger-ai gemini-chat-stdin' "$R"
          grep -q 'LITTLE_KHZ=' "$R"
          grep -q 'BIG_KHZ=' "$R"
          grep -q 'GPU_HZ=' "$R"
          ! grep -R -nE 'GAME LAUNCHER|START HUD|STOP HUD|DjaegerHudService|GameLauncherActivity|SYSTEM_ALERT_WINDOW|windowingMode.?5|WINDOWING_MODE_FREEFORM' app/src/main
          ! grep -R -nE 'echo[[:space:]].*>[[:space:]]*/sys/|tee[[:space:]]+/sys/|iptables|ip6tables|nft ' app/src/main
          grep -q 'android.intent.category.LAUNCHER' "$A"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Build installable APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK and collect
        run: |
          mkdir -p output
          APK=$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)
          test -f "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.12.1-r78-Full-Minus-HUD-Launcher-Freeform.apk
          unzip -t output/*.apk > output/APK_ZIP_TEST.txt
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-r78-Full-Minus-Three
          path: output/*
          if-no-files-found: error