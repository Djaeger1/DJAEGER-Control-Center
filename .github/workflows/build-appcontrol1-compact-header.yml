name: Build APPCONTROL1 Compact Header

on:
  push:
    branches:
      - codex/hermescloud1-appcontrol1-rc1
    paths:
      - 'scripts/r47_appcontrol1.py'
      - '.github/workflows/build-appcontrol1-compact-header.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Rebuild baseline through APPCONTROL1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines()
          marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker)
          end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py; do
            python3 scripts/$s
          done
          python3 scripts/r34_rebuild3_agent_full_hardware_truth.py
          python3 scripts/r35_rebuild3_lang2_mwfix1.py
          python3 scripts/r36_rebuild3_lang3_math1_sync1.py
          python3 scripts/r37_sync2_session_truth_ui_order.py
          python3 scripts/r38_mwfix2_sync3.py
          python3 scripts/r39_attr1_sync4.py
          python3 scripts/r40_hk1_sysfs1_ccsync1.py
          python3 scripts/r41_loopfix1_ccmatch1.py
          python3 scripts/r42_gamereg1.py
          python3 scripts/r43_sharedint1.py
          python3 scripts/r44_hermescloud1.py
          python3 scripts/r45_workloadfinal1.py
          python3 scripts/r46_workloadfinal1_overview_order_fix.py
          python3 scripts/r47_appcontrol1.py

      - name: Compact-header and baseline gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('control-center-r2')
          m=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          b=(root/'app/build.gradle.kts').read_text()
          s=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedSnapshotReader.kt').read_text()
          assert 'versionCode = 12262' in b
          assert 'appcontrol1-rc1' in b
          assert 'CONTROL CENTER' in m
          assert 'CONTROL CENTER • REBUILD3' not in m
          assert 'APP ACTIVE' in m and 'GAME ACTIVE' in m
          assert 'WORKLOAD • GAME / APP / SYSTEM' in m
          assert 'VC129638 / VC12262' in m
          assert s.count('ProcessBuilder("su"') == 1
          assert '/sys/' not in s and '/proc/sys/' not in s
          print('APPCONTROL1_COMPACT_HEADER_GATE=PASS')
          print('OVERVIEW_HEADER=CONTROL CENTER')
          print('CONTROL_CENTER_VC=12262')
          print('MATCHED_MODULE_VC=129638')
          PY

      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Sign and prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist-appcontrol1
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$U" /tmp/appcontrol1-aligned.apk
          PASS="$(openssl rand -hex 24)"
          ALIAS=djaeger-appcontrol1-ci
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/appcontrol1.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER APPCONTROL1, O=DJAEGER, C=ID'
          APK='dist-appcontrol1/DJAEGER-Control-Center-v0.12.1-APPCONTROL1-COMPACT.apk'
          "$BT/apksigner" sign --ks /tmp/appcontrol1.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out "$APK" /tmp/appcontrol1-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > dist-appcontrol1/APK_VERIFY.txt
          unzip -t "$APK" > dist-appcontrol1/APK_ZIP_TEST.txt
          sha256sum "$APK" > dist-appcontrol1/SHA256.txt
          printf '%s\n' \
            'OVERVIEW_HEADER=CONTROL CENTER' \
            'MATCHED_MODULE_VERSION_CODE=129638' \
            'CONTROL_CENTER_VERSION_CODE=12262' \
            'APPCONTROL=APPCONTROL1_RC1' > dist-appcontrol1/BUILD_CONTRACT.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: djaeger-control-center-appcontrol1-compact
          path: dist-appcontrol1/
          if-no-files-found: error
          retention-days: 30
