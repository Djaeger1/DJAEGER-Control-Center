name: DIRECT APK STOCARE CHAT

on:
  push:
    branches:
      - codex/rebuild3-hk1-sysfs1-ccsync1
    paths:
      - '.github/workflows/direct-apk-stocare-chat.yml'

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='dist-hk1-sysfs1-ccsync1/DJAEGER-Control-Center-v0.12.1-REBUILD3-HK1-SYSFS1-CCSYNC1.apk'
          test -f "$APK"
          SRC_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SRC_SIZE="$(stat -c %s "$APK")"
          echo "SOURCE_SHA256=$SRC_SHA"
          echo "SOURCE_SIZE=$SRC_SIZE"
          RESP="$(curl --fail --silent --show-error --retry 2 -T "$APK" https://ul.sto.care)"
          echo "UPLOAD_RESPONSE=$RESP"
          URL="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["url"])' <<<"$RESP")"
          test -n "$URL"
          curl --fail --location --silent --show-error --retry 2 "$URL" -o /tmp/verify.apk
          DST_SHA="$(sha256sum /tmp/verify.apk | awk '{print $1}')"
          DST_SIZE="$(stat -c %s /tmp/verify.apk)"
          echo "DOWNLOADED_SHA256=$DST_SHA"
          echo "DOWNLOADED_SIZE=$DST_SIZE"
          test "$SRC_SHA" = "$DST_SHA"
          test "$SRC_SIZE" = "$DST_SIZE"
          echo "VERIFIED_URL=$URL"
          echo "HANDOFF_STATUS=PASS"
