name: Build DJAEGER Control Center UI6 FIX2
on:
  push:
    branches: [codex/r92-ui6-fix2-runtime-contract]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}

      - name: Generate exact UI6 FIX1 baseline plus FIX2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py; do
            python3 scripts/$s
          done

      - name: UI6 FIX2 source and runtime-contract gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('control-center-r2')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          A=(root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'versionName = "0.12.1-r22-r92ui6-fix2"' in B
          assert 'versionCode = 12229' in B
          assert 'CONTROL CENTER • v0.12.1-r22-r92ui6-fix2 • HERMES H2 RT3 FIX2' in M
          assert 'StatusCard(s);ThoughtsCard(s);HermesCard(s);StrategyCard(s);OutcomeLearningCard(s);' in M
          assert M.count('OutcomeLearningCard(s);') == 1
          assert 'BoxCard("KERNEL AUTHORITY",s.authority.ifBlank{"UNAVAILABLE — authority state not published."},true)' in M
          assert 'BoxCard("SESSION SAFETY",(s.sessionSafety+"\\n"+s.supervisor).trim().ifBlank{"UNAVAILABLE — session safety state not published."},true)' in M
          for required in ['val authority: String,','val sessionSafety: String,','val supervisor: String,','authority = s["AUTHORITY"].orEmpty(),','sessionSafety = s["SESSION_SAFETY"].orEmpty(),','supervisor = s["SUPERVISOR"].orEmpty(),']:
              assert required in C, required
          for required in ['val authority:String=""','val sessionSafety:String=""','val supervisor:String=""','authority=mapped.authority','sessionSafety=mapped.sessionSafety','supervisor=mapped.supervisor','ConsolidatedSnapshotReader']:
              assert required in R, required
          snap=R[R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'):R.index('    suspend fun setUserMode',R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'))]
          for forbidden in ['/sys/','authority_state.env','session_safety.env','session_recovery_state','snapshot_lifecycle.log']:
              assert forbidden not in snap, forbidden
          assert 'Cloud active:' not in M
          thought=M[M.index('@Composable fun ThoughtsCard'):M.index('private fun currentRange',M.index('@Composable fun ThoughtsCard'))]
          assert thought.index('Gemini: $geminiLine') < thought.index('Active brain:')
          assert 'SYSTEM_ALERT_WINDOW' not in A
          for forbidden in ['iptables','ip6tables',' nft ','force-stop','settings put','setprop','/sys/class/','ProcessBuilder']:
              assert forbidden not in M
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+C+B)
          print('UI6_FIX2_SOURCE_GATES=PASS')
          print('UI6_LAYOUT_PRESERVED=PASS')
          print('AUTHORITY_CC_SNAPSHOT_MAPPING=PASS')
          print('SESSION_SAFETY_CC_SNAPSHOT_MAPPING=PASS')
          print('SUPERVISOR_CC_SNAPSHOT_MAPPING=PASS')
          print('SINGLE_ATOMIC_ROOT_READ=PASS')
          print('GEMINI_FIRST_DISPLAY=PRESERVED')
          PY

      - name: Test and build release
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: APK safety scan
        run: |
          set -euo pipefail
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          test -n "$U"
          unzip -t "$U" >/tmp/apk_zip_test.txt
          strings "$U" > /tmp/apk_strings.txt || true
          ! grep -E 'iptables|ip6tables|force-stop|settings put|setprop' /tmp/apk_strings.txt
          echo APK_PRE_SIGN_SAFETY=PASS

      - name: Sign verify and hash
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r92ui6fix2
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r92ui6fix2.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center UI6 FIX2, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          cp "$U" output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-UNSIGNED.apk
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r92ui6fix2.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2.apk > output/APK_ZIP_TEST.txt
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf '%s\n' 'SOURCE_BASELINE=UI6_FIX1_COMMIT_7588d85' 'UI_FAMILY=UI6' 'HERMES_BACKEND=H2_RT3_FIX2' 'OVERVIEW_ORDER=THOUGHT>HERMES>STRATEGI>OUTCOME' 'GEMINI_FIRST_DISPLAY=YES' 'AUTHORITY_SOURCE=CC_SNAPSHOT_AUTHORITY' 'SESSION_SAFETY_SOURCE=CC_SNAPSHOT_SESSION_SAFETY' 'SUPERVISOR_SOURCE=CC_SNAPSHOT_SUPERVISOR' 'SINGLE_ATOMIC_ROOT_READ=YES' 'HERMES_AUTHORITY=DISPLAY_ONLY' > output/BUILD_CONTRACT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2
          path: output/*
          if-no-files-found: error
