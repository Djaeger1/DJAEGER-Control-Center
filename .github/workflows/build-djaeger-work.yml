name: Build DJAEGER WORK APK

on:
  workflow_dispatch:
  push:
    branches: [djaeger-work-build]
    paths:
      - 'djaeger-work-v132/**'
      - '.github/workflows/build-djaeger-work.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore agreed DJAEGER logo
        working-directory: djaeger-work-v132
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/res/drawable
          rm -f app/src/main/res/drawable/djaeger_logo.xml
          cat source-assets/logo.*.b64 | base64 -d > app/src/main/res/drawable/djaeger_logo.png
          cp app/src/main/res/drawable/djaeger_logo.png app/src/main/assets/djaeger_logo.png
          echo "db60ad3b00744246520b53a40d3e28c229496591cd41d3feb5c8ae1ab474e6b7  app/src/main/res/drawable/djaeger_logo.png" | sha256sum -c -
          test -s app/src/main/assets/skin.js
          file app/src/main/res/drawable/djaeger_logo.png

      - name: Full feature preservation checks
        working-directory: djaeger-work-v132
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.djaeger.workdashboard'" app/build.gradle
          grep -q "versionName '1.4.0'" app/build.gradle
          grep -q 'android:label="DJAEGER WORK"' app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'http://192.168.42.129:8766' app/src/main/java/com/djaeger/workdashboard/MainActivity.java
          grep -q 'web.loadUrl(base()+"/")' app/src/main/java/com/djaeger/workdashboard/MainActivity.java
          grep -q 'getAdminToken' app/src/main/java/com/djaeger/workdashboard/MainActivity.java
          grep -q 'copyText' app/src/main/java/com/djaeger/workdashboard/MainActivity.java
          grep -q "work:\['system','today','dw-daily'\]" app/src/main/assets/skin.js
          grep -q "research:\['dw-research-summary','trends'\]" app/src/main/assets/skin.js
          grep -q "planner:\['planner','desk'\]" app/src/main/assets/skin.js
          grep -q "insights:\['channel','knowledge'\]" app/src/main/assets/skin.js
          grep -q "system:\['automation','recovery'\]" app/src/main/assets/skin.js
          grep -q 'SAVE CONNECTION' app/src/main/assets/skin.js
          grep -q 'COPY RESULT FOR CHATGPT' app/src/main/assets/skin.js
          grep -q '/api/work/brief' app/src/main/assets/skin.js
          grep -q '/api/work/research' app/src/main/assets/skin.js

      - name: Build signed APK
        working-directory: djaeger-work-v132
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find djaeger-work-v132/app/build/outputs/apk/debug -type f -name '*debug*.apk' | head -1)"
          test -n "$APK" && test -s "$APK"
          unzip -t "$APK"
          BT="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='com.djaeger.workdashboard'" /tmp/badging.txt
          grep -q "application-label:'DJAEGER WORK'" /tmp/badging.txt
          grep -q "versionName='1.4.0'" /tmp/badging.txt
          unzip -l "$APK" | grep -q 'assets/skin.js'
          unzip -l "$APK" | grep -q 'assets/djaeger_logo.png'
          mkdir -p output
          cp "$APK" output/DJAEGER_WORK_Dashboard_v1.4.0.apk
          sha256sum output/DJAEGER_WORK_Dashboard_v1.4.0.apk | tee output/SHA256.txt
          ls -lh output/DJAEGER_WORK_Dashboard_v1.4.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-WORK-v1.4.0-FULL-FEATURE
          path: output/*
          if-no-files-found: error
          retention-days: 30
