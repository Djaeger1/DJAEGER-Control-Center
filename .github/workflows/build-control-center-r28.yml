name: Build DJAEGER Control Center v0.12.1-r28
on:
  push:
    branches: [codex/v0.12.1-r28-freeform-session-ui]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate R28 from proven R7-R27 chain
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r23_runtime_publication_reconcile.py r24_canonical_runtime_reader.py r25_live_gemini_vault_truth.py r26_live_clock_overview.py r27_live_temperatures.py r28_freeform_session_ui.py; do python3 scripts/$s; done
      - name: R28 regression gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter')
          R=(root/'DjaegerRepository.kt').read_text(); M=(root/'MainActivity.kt').read_text(); MP=(root/'ConsolidatedRuntimeMapper.kt').read_text(); B=Path('control-center-r2/app/build.gradle.kts').read_text(); A=Path('control-center-r2/app/src/main/AndroidManifest.xml').read_text()
          checks={
            'VERSION':'0.12.1-r28' in B,
            'RUNTIME_IDENTITY_REAL':'runtimeVersion=canonicalRuntimeVersion(mapped.moduleVersion)' in R,
            'THOUGHTS_REAL':'s["THOUGHTS"]' in MP and 'thoughts=mapped.thoughts' in R,
            'MEMORY_REAL':'s["MEMORY"]' in MP and 'memoryStatus=mapped.memoryStatus' in R,
            'MODULE_VAULT_UI':'GEMINI KEY VAULT • MODULE TRUTH' in M,
            'LIVE_CLOCKS':'LITTLE CPU' in M and 'BIG CPU' in M and 'f.gpuHz' in M,
            'LIVE_TEMPS':all(x in M for x in ['f.cpuT.toInt()','f.gpuT.toInt()','f.skinT.toInt()','f.batT.toInt()']),
            'RESPONSIVE_FREEFORM_TABS':'ResponsiveTabs(tab){tab=it}' in M and 'if(maxWidth < 560.dp)' in M,
            'ALL_TABS_PRESERVED':all(x in M for x in ['"Overview"','"Session"','"Charts"','"AI"','"History"','"Safety"','"Logs"']),
            'SESSION_PERFORMANCE_TRUTH':'BoxCard("SESSION PERFORMANCE",body)' in M and 's.active=="1"&&s.sampleFresh' in M,
            'NO_STALE_PERFORMANCE_CARD':'BoxCard("PERFORMANCE","Little:' not in M,
            'POWER_INVALID_TRUTH':'Waiting for a valid active-session power sample.' in M,
            'CC_SNAPSHOT_ONLY':'ConsolidatedSnapshotReader(persistent + "/cc_snapshot").read(4000)' in R,
            'NO_OVERLAY':'SYSTEM_ALERT_WINDOW' not in A,
            'NO_KEYS':not bool(re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+MP+B))
          }
          forbidden=['/sys/class/net','iptables ','ip6tables ','nft ','tc qdisc','settings put global private_dns','> /sys/','tee /sys/']; checks['NO_NETWORK_OR_SYSFS_MUTATION']=not any(x in R+MP for x in forbidden)
          for k,v in checks.items(): print(f'{k}={"PASS" if v else "FAIL"}')
          bad=[k for k,v in checks.items() if not v]; assert not bad,','.join(bad)
          PY
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r28
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r28.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r28.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r28.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r28.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r28.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r28.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r28
          path: output/*
          if-no-files-found: error
