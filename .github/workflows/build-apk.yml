name: Build DJAEGER Control Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract DJAEGER source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          test -f project/DJAEGER_Control_Center/settings.gradle.kts
          test -f project/DJAEGER_Control_Center/build.gradle.kts
          echo "Gradle project root verified."

      - name: Align Java and Kotlin JVM targets
        working-directory: project/DJAEGER_Control_Center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          marker = '    kotlinOptions { jvmTarget = "17" }'
          compile_opts = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          '''
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              if marker not in s:
                  raise SystemExit('Expected kotlinOptions JVM 17 marker not found')
              s = s.replace(marker, compile_opts + marker)
          p.write_text(s)
          PY
          grep -n -E 'compileOptions|sourceCompatibility|targetCompatibility|jvmTarget' app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          APK="$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.5.3-RC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-APK
          path: output/DJAEGER-Control-Center-v0.5.3-RC.apk
          if-no-files-found: error
