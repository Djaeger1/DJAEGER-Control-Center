name: Build DJAEGER Control Center APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'scripts/build11_ai_bridge_patch.py'
      - 'scripts/build12_hardening_patch.py'
      - 'scripts/build14_profileinstaller_hardening_patch.py'
      - 'scripts/build15_evolution_hud_patch.py'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract DJAEGER source
        run: |
          rm -rf project && mkdir project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          test -f project/DJAEGER_Control_Center/settings.gradle.kts
      - name: Apply Build 11 AI Bridge patch
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build11_ai_bridge_patch.py
      - name: Apply Build 12 hardening patch
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build12_hardening_patch.py
      - name: Apply Build 14 targeted ProfileInstaller hardening
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build14_profileinstaller_hardening_patch.py
      - name: Apply Build 15 Evolution HUD and Game Launcher
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build15_evolution_hud_patch.py
      - name: Pre-build regression and safety assertions
        working-directory: project/DJAEGER_Control_Center
        run: |
          grep -q 'EVOLUTION HUD' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'GAME LAUNCHER' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'START HUD' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'EVOLUTION STATUS' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'GEMINI CONVERSATION' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'djaeger-ai mode' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-key-stdin' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-key-status' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-key-delete' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-chat-stdin' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-knowledge-status' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-chat-clear' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'PasswordVisualTransformation' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'prompt.take(8000)' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'handler.postDelayed(this,1000)' app/src/main/java/com/djaeger/controlcenter/DjaegerHudService.kt
          grep -q 'TYPE_APPLICATION_OVERLAY' app/src/main/java/com/djaeger/controlcenter/DjaegerHudService.kt
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.FOREGROUND_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'androidx.profileinstaller.ProfileInstallReceiver' app/src/main/AndroidManifest.xml
          grep -q 'tools:node="remove"' app/src/main/AndroidManifest.xml
          ! grep -R -nE 'android.permission.INTERNET|WRITE_SETTINGS|PACKAGE_USAGE_STATS' app/src/main || exit 1
          ! grep -R -nE 'settings put|setprop|force-stop|svc (wifi|data)|iptables|ip6tables|nft ' app/src/main || exit 1
          ! grep -R -nE '/sys/.+([>]|tee|echo|write)' app/src/main || exit 1
          ! grep -R -nE 'gemini-key[[:space:]]+\$|gemini-chat[[:space:]]+\$' app/src/main/java || exit 1
          ! grep -q 'ui-tooling"' app/build.gradle.kts || exit 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace
      - name: Static safety and merged-manifest final audit
        working-directory: project/DJAEGER_Control_Center
        run: |
          ! grep -R -nE 'android.permission.INTERNET|WRITE_SETTINGS|PACKAGE_USAGE_STATS' app/src/main || exit 1
          ! grep -R -nE 'settings put|setprop|force-stop|svc (wifi|data)|iptables|ip6tables|nft ' app/src/main || exit 1
          ! grep -R -nE '/sys/.+([>]|tee|echo|write)' app/src/main || exit 1
          grep -q 'gemini-chat-stdin' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'gemini-knowledge-status' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'TYPE_APPLICATION_OVERLAY' app/src/main/java/com/djaeger/controlcenter/DjaegerHudService.kt
          grep -q 'djaeger-ai mode' app/src/main/java/com/djaeger/controlcenter/DjaegerHudService.kt
          MERGED="$(find app/build/intermediates -path '*merged_manifest*' -o -path '*merged_manifests*' | grep 'AndroidManifest.xml' | head -1 || true)"
          if [ -z "$MERGED" ]; then MERGED="$(find app/build/intermediates -name AndroidManifest.xml | head -1)"; fi
          test -n "$MERGED"
          echo "Auditing merged manifest: $MERGED"
          BLOCKED='android.permission.INTERNET|android.permission.DUMP|WRITE_SETTINGS|PACKAGE_USAGE_STATS|androidx.compose.ui.tooling.PreviewActivity|androidx.profileinstaller.ProfileInstallReceiver'
          MATCHES="$(grep -nE "$BLOCKED" "$MERGED" || true)"
          if [ -n "$MATCHES" ]; then
            echo '=== BLOCKED MERGED-MANIFEST ENTRIES ==='
            echo "$MATCHES"
            echo '=== END BLOCKED ENTRIES ==='
            exit 1
          fi
          grep -q 'android.permission.SYSTEM_ALERT_WINDOW' "$MERGED"
          grep -q 'android.permission.FOREGROUND_SERVICE' "$MERGED"
          grep -q 'DjaegerHudService' "$MERGED"
          grep -q 'GameLauncherActivity' "$MERGED"
          echo 'Merged manifest passed: overlay/FGS only as intentional HUD permissions; blocked permissions absent.'
      - name: Collect APK and hash
        run: |
          mkdir output
          APK="$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.7.0-RC-Evolution-HUD.apk
          sha256sum output/*.apk > output/SHA256.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-v0.7.0-RC-Evolution-HUD
          path: output/*
          if-no-files-found: error