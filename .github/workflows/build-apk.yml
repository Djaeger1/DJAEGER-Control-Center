name: Build DJAEGER Control Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract DJAEGER source
        run: |
          rm -rf project
          mkdir -p project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          test -f project/DJAEGER_Control_Center/settings.gradle.kts
          test -f project/DJAEGER_Control_Center/build.gradle.kts
          echo "Gradle project root verified."

      - name: Apply build-only Kotlin syntax fixes
        working-directory: project/DJAEGER_Control_Center
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('app/build.gradle.kts')
          s = gradle.read_text()
          marker = '    kotlinOptions { jvmTarget = "17" }'
          compile_opts = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          '''
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              if marker not in s:
                  raise SystemExit('Expected kotlinOptions JVM 17 marker not found')
              s = s.replace(marker, compile_opts + marker)
          gradle.write_text(s)

          repo = Path('app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt')
          s = repo.read_text()
          s = s.replace('"__$a__\\n"', '"__${a}__\\n"')
          s = s.replace('"__$b__\\n"', '"__${b}__\\n"')
          repo.write_text(s)

          main = Path('app/src/main/java/com/djaeger/controlcenter/MainActivity.kt')
          s = main.read_text()
          old = '@Composable fun LineChartCard(title:String,values:List<Float>,min:Float,max:Float,current:String){Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(containerColor=Card),shape=RoundedCornerShape(14.dp)){Column(Modifier.padding(14.dp)){Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){Text(title,color=Green,fontWeight=FontWeight.Bold);Text(current,fontWeight=FontWeight.Bold)};Spacer(Modifier.height(10.dp));Canvas(Modifier.fillMaxWidth().height(120.dp)){if(values.size>1){val lo=min;val hi=max.coerceAtLeast(lo+1);val step=size.width/(values.size-1);fun y(v:Float)=size.height-(v.coerceIn(lo,hi)-lo)/(hi-lo)*size.height;for(i in 1 until values.size)drawLine(color=Green,start=Offset((i-1)*step,y(values[i-1])),end=Offset(i*step,y(values[i])),strokeWidth=3f)}}}}}'
          new = '''@Composable
          fun LineChartCard(title:String, values:List<Float>, min:Float, max:Float, current:String) {
              Card(Modifier.fillMaxWidth(), colors=CardDefaults.cardColors(containerColor=Card), shape=RoundedCornerShape(14.dp)) {
                  Column(Modifier.padding(14.dp)) {
                      Row(Modifier.fillMaxWidth(), horizontalArrangement=Arrangement.SpaceBetween) {
                          Text(title, color=Green, fontWeight=FontWeight.Bold)
                          Text(current, fontWeight=FontWeight.Bold)
                      }
                      Spacer(Modifier.height(10.dp))
                      Canvas(Modifier.fillMaxWidth().height(120.dp)) {
                          if (values.size > 1) {
                              val lo = min
                              val hi = max.coerceAtLeast(lo + 1f)
                              val step = size.width / (values.size - 1)
                              fun chartY(v:Float):Float {
                                  return size.height - (v.coerceIn(lo, hi) - lo) / (hi - lo) * size.height
                              }
                              for (i in 1 until values.size) {
                                  drawLine(
                                      color=Green,
                                      start=Offset((i - 1) * step, chartY(values[i - 1])),
                                      end=Offset(i * step, chartY(values[i])),
                                      strokeWidth=3f
                                  )
                              }
                          }
                      }
                  }
              }
          }'''
          if old not in s:
              raise SystemExit('Expected LineChartCard source not found')
          main.write_text(s.replace(old, new))
          PY
          grep -n -E 'sourceCompatibility|targetCompatibility|jvmTarget' app/build.gradle.kts
          grep -n 'substringAfter' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -n 'fun LineChartCard' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          APK="$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.5.3-RC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-APK
          path: output/DJAEGER-Control-Center-v0.5.3-RC.apk
          if-no-files-found: error
