name: Build DJAEGER Control Center APK
on:
  workflow_dispatch:
  push:
    branches: [ui/v0.12.1-djaeger-ai-sync]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'scripts/*.py'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract baseline
        run: |
          rm -rf project && mkdir project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          test -f project/DJAEGER_Control_Center/settings.gradle.kts
      - name: Rebuild proven v0.12.1 chain
        working-directory: project/DJAEGER_Control_Center
        run: |
          python3 ../../scripts/build11_ai_bridge_patch.py
          python3 ../../scripts/build12_hardening_patch.py
          python3 ../../scripts/build14_profileinstaller_hardening_patch.py
          python3 ../../scripts/build15_evolution_hud_patch.py
          python3 ../../scripts/build16_game_turbo_experience_patch.py
          python3 ../../scripts/build17_game_turbo_polish_patch.py
          python3 ../../scripts/build18_game_turbo_compile_fix.py
          python3 ../../scripts/build19_game_turbo_service_rewrite.py
          python3 ../../scripts/build20_miui_game_turbo_authority_patch.py
          python3 ../../scripts/build21_djaeger_ai_kernel_sync_patch.py
          python3 ../../scripts/build22_hud_flicker_fix_patch.py
          python3 ../../scripts/build23_hud_compile_fix.py
      - name: Apply v0.12.1 compact sync baseline
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build41_v0121_latest_djaeger_sync.py
      - name: Apply compile-safe live telemetry bridge
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build45_v0121_live_telemetry_safe.py
      - name: Harden missing telemetry rendering
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build46_v0121_missing_telemetry_semantics.py
      - name: Timestamp direct telemetry samples
        working-directory: project/DJAEGER_Control_Center
        run: python3 ../../scripts/build47_live_sample_timestamp.py
      - name: Source audit
        working-directory: project/DJAEGER_Control_Center
        run: |
          grep -q '0.12.1-r1-live-telemetry-djaeger-r2' app/build.gradle.kts
          grep -q 'DJAEGER-AI v12.9.50-r2 SYNC' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'Target module: v12.9.50-r2' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'LITTLE_KHZ=' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'BIG_KHZ=' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'GPU_HZ=' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'BAT_TEMP_RAW=' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'sm5602_bat/current_now' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'THERMAL=' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'LIVE_POWER_SUPPLY' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'epoch=if(csv.epoch>0)csv.epoch else if(hasLive)now else 0' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'if(t>=0)' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'GEMINI CONVERSATION' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'ASK GEMINI' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'COPY' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'djaeger-ai gemini-key-status' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-key-stdin' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-key-delete' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-chat-stdin' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai gemini-chat-clear' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'djaeger-ai mode ' app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          ! grep -R -nE 'GAME LAUNCHER|START HUD|STOP HUD|EVOLUTION STATUS|DjaegerHudService|GameLauncherActivity' app/src/main || exit 1
          ! grep -R -nE 'echo[[:space:]].*>[[:space:]]*/sys/|tee[[:space:]]+/sys/|settings put|setprop|force-stop|iptables|ip6tables|nft ' app/src/main || exit 1
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.PACKAGE_USAGE_STATS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.FOREGROUND_SERVICE' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace
      - name: Merged manifest audit
        working-directory: project/DJAEGER_Control_Center
        run: |
          MERGED="$(find app/build/intermediates -name AndroidManifest.xml | head -1)"
          test -n "$MERGED"
          grep -q 'android.intent.category.LAUNCHER' "$MERGED"
          ! grep -nE 'android.permission.INTERNET|android.permission.DUMP|WRITE_SETTINGS|QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|PACKAGE_USAGE_STATS|RECEIVE_BOOT_COMPLETED|FOREGROUND_SERVICE|BIND_ACCESSIBILITY_SERVICE|androidx.compose.ui.tooling.PreviewActivity|androidx.profileinstaller.ProfileInstallReceiver' "$MERGED" || exit 1
      - name: Collect APK, source snapshot and hash
        run: |
          mkdir output
          APK="$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.12.1-r1-Live-Telemetry-DJAEGER-r2.apk
          cp project/DJAEGER_Control_Center/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt output/MainActivity.generated.kt
          cp project/DJAEGER_Control_Center/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt output/DjaegerRepository.generated.kt
          cp project/DJAEGER_Control_Center/app/src/main/AndroidManifest.xml output/AndroidManifest.generated.xml
          sha256sum output/*.apk > output/SHA256.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-v0.12.1-r1-Live-Telemetry-r2
          path: output/*
          if-no-files-found: error