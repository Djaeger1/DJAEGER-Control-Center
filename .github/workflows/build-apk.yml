name: Build DJAEGER Control Center APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract DJAEGER source
        run: |
          mkdir -p project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          echo "Source extracted:"
          find project -maxdepth 2 -type f | head -50

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p output
          APK="$(find project -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.5.3-RC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-APK
          path: output/DJAEGER-Control-Center-v0.5.3-RC.apk
