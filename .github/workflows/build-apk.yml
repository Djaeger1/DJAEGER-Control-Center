name: Build DJAEGER Control Center APK
on:
  workflow_dispatch:
  push:
    branches: [main, ui/miui-game-turbo-phase1-dev, ui/monitoring-only-v1]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'scripts/*.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'scripts/*.py'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract DJAEGER source
        run: |
          rm -rf project && mkdir project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
          test -f project/DJAEGER_Control_Center/settings.gradle.kts
      - name: Apply historical stable patch chain
        working-directory: project/DJAEGER_Control_Center
        run: |
          python3 ../../scripts/build11_ai_bridge_patch.py
          python3 ../../scripts/build12_hardening_patch.py
          python3 ../../scripts/build14_profileinstaller_hardening_patch.py
          python3 ../../scripts/build15_evolution_hud_patch.py
          python3 ../../scripts/build16_game_turbo_experience_patch.py
          python3 ../../scripts/build17_game_turbo_polish_patch.py
          python3 ../../scripts/build18_game_turbo_compile_fix.py
          python3 ../../scripts/build19_game_turbo_service_rewrite.py
          python3 ../../scripts/build20_miui_game_turbo_authority_patch.py
          python3 ../../scripts/build21_djaeger_ai_kernel_sync_patch.py
          python3 ../../scripts/build22_hud_flicker_fix_patch.py
          python3 ../../scripts/build23_hud_compile_fix.py
      - name: Convert to Monitoring Edition
        working-directory: project/DJAEGER_Control_Center
        run: |
          python3 ../../scripts/build38_monitoring_only_redesign.py
          python3 ../../scripts/build39_monitoring_repository_hardening.py
      - name: Monitoring-only source audit
        working-directory: project/DJAEGER_Control_Center
        run: |
          grep -q '1.0.0-monitoring-edition' app/build.gradle.kts
          grep -q 'Monitoring Edition • Kernel + DJAEGER telemetry' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'PROTECTED ACTUATORS • READ ONLY' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q '/sys/class/thermal/cooling_device17/cur_state' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q '/sys/class/thermal/cooling_device16/cur_state' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q '/data/adb/modules/djaeger_game_stabilizer/telemetry.csv' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'djaeger-ai gemini-status' app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          ! grep -R -nE 'settings put|setprop|force-stop|svc (wifi|data)|iptables|ip6tables|nft |djaeger-ai mode |policy-intent |native_write_plan|TYPE_APPLICATION_OVERLAY|startForegroundService\(|startService\(' app/src/main || exit 1
          ! grep -R -nE '/sys/.+([>]|tee|echo|write)' app/src/main || exit 1
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.PACKAGE_USAGE_STATS' app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace
      - name: Merged manifest audit
        working-directory: project/DJAEGER_Control_Center
        run: |
          MERGED="$(find app/build/intermediates -name AndroidManifest.xml | head -1)"
          test -n "$MERGED"
          grep -q 'android.intent.category.LAUNCHER' "$MERGED"
          ! grep -nE 'android.permission.INTERNET|android.permission.DUMP|WRITE_SETTINGS|QUERY_ALL_PACKAGES|SYSTEM_ALERT_WINDOW|PACKAGE_USAGE_STATS|RECEIVE_BOOT_COMPLETED|BIND_ACCESSIBILITY_SERVICE|androidx.compose.ui.tooling.PreviewActivity|androidx.profileinstaller.ProfileInstallReceiver' "$MERGED" || exit 1
      - name: Collect APK and hash
        run: |
          mkdir output
          APK="$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v1.0-Monitoring-Edition.apk
          sha256sum output/*.apk > output/SHA256.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-v1.0-Monitoring-Edition
          path: output/*
          if-no-files-found: error
