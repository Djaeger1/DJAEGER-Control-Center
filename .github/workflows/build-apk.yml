name: Build DJAEGER Control Center APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract DJAEGER source
        run: |
          rm -rf project && mkdir -p project
          unzip -q DJAEGER_Control_Center_v0.5.3_RC_CoGo_AndroidX_Fix.zip -d project
      - name: Apply v0.5.4 realtime monitoring
        working-directory: project/DJAEGER_Control_Center
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('app/build.gradle.kts'); s=g.read_text()
          marker='    kotlinOptions { jvmTarget = "17" }'
          if 'sourceCompatibility = JavaVersion.VERSION_17' not in s:
              s=s.replace(marker,'    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n'+marker)
          s=s.replace('versionCode = 8','versionCode = 9').replace('versionName = "0.5.3-rc-cogo"','versionName = "0.5.4-rc"')
          g.write_text(s)

          r=Path('app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt'); s=r.read_text()
          s=s.replace('"__$a__\\n"','"__${a}__\\n"').replace('"__$b__\\n"','"__${b}__\\n"')
          old='    private fun parseTelemetry(line:String):Telemetry{val c=parseCsv(line);fun s(i:Int)=c.getOrNull(i)?.trim().orEmpty();return Telemetry(s(0).toLongOrNull()?:0,s(1).toIntOrNull()?:0,s(2).toIntOrNull()?:0,s(3).toIntOrNull()?:0,s(4).toIntOrNull()?:0,s(5).toLongOrNull()?:0,s(6).toLongOrNull()?:0,s(7).toLongOrNull()?:0,s(8),s(9).toDoubleOrNull()?:0.0,s(10).toDoubleOrNull()?:0.0,s(11).toDoubleOrNull()?:0.0,s(12).toDoubleOrNull()?:0.0,s(13).toDoubleOrNull()?:0.0,s(15),s(16).toLongOrNull()?:0,s(17).toLongOrNull()?:0,s(18).toDoubleOrNull()?:0.0,s(19),s(20),s(22))}'
          new='''    private fun parseTelemetry(line:String):Telemetry {
              val c=parseCsv(line)
              fun f(i:Int)=c.getOrNull(i)?.trim().orEmpty()
              return Telemetry(f(0).toLongOrNull()?:0,f(1).toIntOrNull()?:0,f(2).toIntOrNull()?:0,f(3).toIntOrNull()?:0,f(4).toIntOrNull()?:0,f(5).toLongOrNull()?:0,f(6).toLongOrNull()?:0,f(7).toLongOrNull()?:0,f(8),f(9).toDoubleOrNull()?:0.0,f(10).toDoubleOrNull()?:0.0,f(11).toDoubleOrNull()?:0.0,f(12).toDoubleOrNull()?:0.0,f(13).toDoubleOrNull()?:0.0,f(15),f(16).toLongOrNull()?:0,f(17).toLongOrNull()?:0,f(18).toDoubleOrNull()?:0.0,f(19),f(20),f(22))
          }'''
          if old in s: s=s.replace(old,new)
          r.write_text(s)

          m=Path('app/src/main/java/com/djaeger/controlcenter/MainActivity.kt'); s=m.read_text()
          s=s.replace('import androidx.compose.ui.Modifier','import androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalClipboardManager\nimport androidx.compose.ui.text.AnnotatedString')
          s=s.replace('CONTROL CENTER • v0.5.3 RC • REGRESSION VALIDATED','CONTROL CENTER • v0.5.4 RC • REALTIME 1s')
          old_ai='@Composable fun AI(s:RuntimeState){Column(Modifier.verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(10.dp)){BoxCard("AI SUMMARY",aiSummary(s));BoxCard("LOCAL BRAIN",s.brain.ifBlank{"No state published yet"});BoxCard("ADAPTIVE OPERATING ENVELOPE",s.envelope.ifBlank{"No envelope published yet"});BoxCard("GEMINI HTTP STATE",s.geminiHttp.ifBlank{"No Gemini HTTP state yet"},true);BoxCard("GEMINI SERVER STATE",s.geminiServer.ifBlank{"No server state / no active backoff"},true)}}'
          new_ai='''@Composable fun AI(s:RuntimeState){
              Column(Modifier.verticalScroll(rememberScrollState()),verticalArrangement=Arrangement.spacedBy(10.dp)){
                  BoxCard("AI SUMMARY • LIVE",aiSummary(s))
                  BoxCard("LOCAL BRAIN • LIVE",localBrainDisplay(s),true)
                  BoxCard("ADAPTIVE OPERATING ENVELOPE • LIVE",s.envelope.ifBlank{"No envelope published yet"},true)
                  BoxCard("GEMINI HTTP STATE • LIVE",s.geminiHttp.ifBlank{"No Gemini HTTP state yet"},true)
                  BoxCard("GEMINI SERVER STATE • LIVE",s.geminiServer.ifBlank{"No server state / no active backoff"},true)
                  BoxCard("AI DECISION TIMELINE • LIVE",decisionTimeline(s),true)
              }
          }
          private fun localBrainDisplay(s:RuntimeState):String {
              if(s.brain.isNotBlank()) return s.brain
              val d=s.latestDecision
              if(d==null) return "STATE=NO_ACTIVE_BRAIN_STATE\\nNo retained Decision Ledger entry yet."
              return "STATE=NO_ACTIVE_BRAIN_STATE\\nLAST RETAINED DECISION\\nID: ${d.id}\\nGame: ${d.game}\\nScene: ${d.scene}\\nProfile: ${d.profile}\\nLittle: ${d.little}\\nBig: ${d.big}\\nGPU: ${d.gpu}\\nOutcome: ${d.outcome}\\nPred FPS: ${d.predFps}\\nPred Skin: ${d.predSkin}\\nActual FPS: ${d.actualFps}\\nActual Skin: ${d.actualSkin}\\nWindow: ${d.window}"
          }
          private fun decisionTimeline(s:RuntimeState):String {
              val d=s.latestDecision
              if(d==null) return "OBSERVE: waiting for Decision Ledger data"
              return "OBSERVE: game=${d.game}, scene=${d.scene}\\nPLAN: profile=${d.profile}, budgets L/B/G=${d.little}/${d.big}/${d.gpu}\\nAPPLIED/RECORDED: outcome=${d.outcome}\\nMEASURE: predicted FPS=${d.predFps}, actual FPS=${d.actualFps}, predicted skin=${d.predSkin}, actual skin=${d.actualSkin}\\nLEARN: latest retained decision ID=${d.id}, window=${d.window}"
          }'''
          if old_ai not in s: raise SystemExit('AI source not found')
          s=s.replace(old_ai,new_ai)
          old_box='@Composable fun BoxCard(title:String,text:String,mono:Boolean=false){Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(containerColor=Card),shape=RoundedCornerShape(14.dp)){Column(Modifier.padding(14.dp)){Text(title,color=Green,fontWeight=FontWeight.Bold,style=MaterialTheme.typography.labelLarge);Spacer(Modifier.height(7.dp));Text(text,color=Color(0xFFE6EAF0),fontFamily=if(mono)FontFamily.Monospace else FontFamily.Default,style=MaterialTheme.typography.bodyMedium)}}}'
          new_box='''@Composable fun BoxCard(title:String,text:String,mono:Boolean=false){
              val clipboard=LocalClipboardManager.current
              Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(containerColor=Card),shape=RoundedCornerShape(14.dp)){
                  Column(Modifier.padding(14.dp)){
                      Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){
                          Text(title,color=Green,fontWeight=FontWeight.Bold,style=MaterialTheme.typography.labelLarge)
                          TextButton(onClick={clipboard.setText(AnnotatedString("DJAEGER Control Center v0.5.4 RC\\n["+title+"]\\n"+text))}){Text("COPY")}
                      }
                      Spacer(Modifier.height(7.dp))
                      Text(text,color=Color(0xFFE6EAF0),fontFamily=if(mono)FontFamily.Monospace else FontFamily.Default,style=MaterialTheme.typography.bodyMedium)
                  }
              }
          }'''
          if old_box not in s: raise SystemExit('BoxCard source not found')
          s=s.replace(old_box,new_box)
          s=s.replace('delay(2000)', 'delay(1000)').replace('delay(3000)', 'delay(1000)').replace('delay(5000)', 'delay(1000)')
          m.write_text(s)
          PY
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: project/DJAEGER_Control_Center
        run: gradle :app:assembleDebug --stacktrace
      - name: Static read-only audit
        working-directory: project/DJAEGER_Control_Center
        run: |
          ! grep -R -nE 'settings put|setprop|force-stop|/sys/.*(echo|write)|android.permission.INTERNET' app/src/main || exit 1
      - name: Collect APK
        run: |
          mkdir -p output
          APK="$(find project/DJAEGER_Control_Center/app/build/outputs/apk -type f -name '*debug*.apk' | head -1)"
          test -n "$APK"
          cp "$APK" output/DJAEGER-Control-Center-v0.5.4-RC-Realtime.apk
          sha256sum output/DJAEGER-Control-Center-v0.5.4-RC-Realtime.apk > output/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.5.4-RC-Realtime
          path: output/*
          if-no-files-found: error
