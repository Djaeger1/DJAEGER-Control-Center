name: Build DJAEGER Control Center v0.12.1-r8 Atomic Bridge
on:
  push:
    branches: [codex/v0.12.1-r3-root-vault]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Apply r7 baseline and atomic bridge
        run: |
          awk '/python3 - <<.PY./{f=1;next} f&&/^          PY$/{exit} f{sub(/^          /,"");print}' .github/workflows/build-control-center-r7-layout-final.yml >/tmp/r7.py
          python3 /tmp/r7.py
          python3 - <<'PY'
          from pathlib import Path
          bp=Path('control-center-r2/app/build.gradle.kts')
          b=bp.read_text().replace('versionCode = 12107','versionCode = 12108').replace('versionName = "0.12.1-r7"','versionName = "0.12.1-r8"')
          bp.write_text(b)
          rp=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt')
          r=rp.read_text()
          start=r.index('        val liveCmd = """')
          end=r.index('        """.trimIndent()',start)+len('        """.trimIndent()')
          fast='''        val liveCmd = """
        if [ -s '$persistent/cc_snapshot' ]; then
          cat '$persistent/cc_snapshot'
        else
          echo __INSTALLED__; [ -d '$module' ] && echo 1 || echo 0
          echo __VERSION__; sed -n 's/^version=//p' '$module/module.prop' 2>/dev/null | head -n 1
          echo __RUNTIME__; cat '$persistent/runtime_status' 2>/dev/null
          echo __TEL__; tail -n 1 '$module/telemetry.csv' 2>/dev/null
          echo __NETWORK__; cat '$persistent/network_status' 2>/dev/null
          echo __LIVE__
          echo __BRAIN__; cat '$persistent/local_brain_state' 2>/dev/null
          echo __ENV__; cat '$persistent/adaptive_operating_envelope' 2>/dev/null
          echo __HTTP__; cat '$persistent/gemini_http_state' 2>/dev/null
          echo __SERVER__; cat '$persistent/gemini_server_state' 2>/dev/null
          echo __DECISIONS__; tail -n 8 '$persistent/decision_ledger.csv' 2>/dev/null
          echo __PLANS__; tail -n 8 '$persistent/plan_history.csv' 2>/dev/null
          echo __FRAME__; tail -n 8 '$module/frame_intel.csv' 2>/dev/null
          echo __LOG__; tail -n 16 '$module/controller.log' 2>/dev/null
        fi
        """.trimIndent()'''
          r=r[:start]+fast+r[end:]
          r=r.replace('val (rc,out)=su(liveCmd)', 'val (rc,out)=su(liveCmd,4000)')
          old='active=rt["active"]?:"0",game=rt["game"]?:"NA",window=rt["window_mode"]?:"INACTIVE",controllerPid=rt["controller_pid"]?:"",predictorPid=rt["predictor_pid"]?:"",updated=rt["updated_at"]?.toLongOrNull()?:0,userMode=rt["user_mode"]?:"AUTO"'
          new='active=cleanNet(rt["active"]).ifBlank{"0"},game=cleanNet(rt["game"]).ifBlank{"NA"},window=cleanNet(rt["window_mode"]).ifBlank{"INACTIVE"},controllerPid=cleanNet(rt["controller_pid"]),predictorPid=cleanNet(rt["predictor_pid"]),updated=cleanNet(rt["updated_at"]).toLongOrNull()?:0,userMode=cleanNet(rt["user_mode"]).ifBlank{"AUTO"}'
          if old not in r: raise SystemExit('runtime parser anchor missing')
          r=r.replace(old,new)
          rp.write_text(r)
          mp=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt')
          s=mp.read_text().replace('CONTROL CENTER • v0.12.1-r7 • ${state.moduleVersion} • NETWORK INTELLIGENCE • KEY VAULT','CONTROL CENTER • v0.12.1-r8 • ${state.moduleVersion} • ATOMIC TELEMETRY BRIDGE • NETWORK INTELLIGENCE • KEY VAULT')
          mp.write_text(s)
          PY
      - name: Regression checks
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.12.1-r8"' control-center-r2/app/build.gradle.kts
          grep -q "cc_snapshot" control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'NetworkCard(s.network)' control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          ! grep -q 'thermal_zone\*' control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -q 'su(liveCmd,4000)' control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify and audit
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-r8-atomic
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r8.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r8.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r8-AtomicTelemetryBridge.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/DJAEGER-Control-Center-v0.12.1-r8-AtomicTelemetryBridge.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r8-AtomicTelemetryBridge.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r8-AtomicTelemetryBridge.apk > output/SHA256SUMS.txt
          rm output/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r8-AtomicTelemetryBridge
          path: output/*
          if-no-files-found: error
          retention-days: 30
