name: Build VC129659 UI1 FIX33
on:
  push:
    branches: [codex/hermes-neuron-ask-shadow1-uifix1]
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Rebuild exact current Control Center source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines()
          marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker)
          end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py; do python3 scripts/$s; done
          python3 scripts/r34_rebuild3_agent_full_hardware_truth.py
          python3 scripts/r35_rebuild3_lang2_mwfix1.py
          python3 scripts/r36_rebuild3_lang3_math1_sync1.py
          python3 scripts/r37_sync2_session_truth_ui_order.py
          python3 scripts/r38_mwfix2_sync3.py
          python3 scripts/r39_attr1_sync4.py
          python3 scripts/r40_hk1_sysfs1_ccsync1.py
          python3 scripts/r41_loopfix1_ccmatch1.py
          python3 scripts/r42_gamereg1.py
          python3 scripts/r43_sharedint1.py
          python3 scripts/r44_hermescloud1.py
          python3 scripts/r45_workloadfinal1.py
          python3 scripts/r46_workloadfinal1_overview_order_fix.py
          python3 scripts/r50_hermes_neuron_ask1.py
          python3 scripts/r51_hermes_neuron_ask_shadow1_uifix1.py

      - name: Apply VC129659 provider-aware UI patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('control-center-r2')
          main=root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt'
          build=root/'app/build.gradle.kts'
          M=main.read_text()
          B=build.read_text()

          start=M.index('@Composable fun ThoughtsCard(s:RuntimeState)')
          end=M.index('@Composable fun AgentRebuild3Card',start)
          block=M[start:end]

          # Preserve card/layout; only clean language display and make provider attribution explicit.
          old='''    val cloudState=envField(s.brain,"CLOUD_PLAN_STATE").ifBlank{"UNAVAILABLE"}
    val cloudConnection=envField(s.brain,"CLOUD_CONNECTION_STATUS").ifBlank{"UNKNOWN"}
    val cloudProvider=envField(s.brain,"CLOUD_PROVIDER").ifBlank{if(cloudConnection!="UNKNOWN") "GEMINI" else "—"}
    val cloudInControl=envField(s.brain,"CLOUD_IN_CONTROL").ifBlank{if(currentBrain=="GEMINI") "YES" else "NO"}'''
          new='''    val cloudState=envField(s.brain,"CLOUD_PLAN_STATE").ifBlank{"UNAVAILABLE"}
    val cloudConnection=envField(s.brain,"CLOUD_CONNECTION_STATUS").ifBlank{"UNKNOWN"}
    val cloudProvider=envField(s.brain,"CLOUD_PROVIDER").ifBlank{if(cloudConnection!="UNKNOWN") "GEMINI" else "—"}
    val cloudControlProvider=envField(s.brain,"CLOUD_CONTROL_PROVIDER").ifBlank{
        when{
            currentBrain=="GEMINI" -> "GEMINI"
            envField(s.brain,"HERMES_BACKEND").equals("CLOUD",true) && (currentBrain=="HERMES_H2"||currentBrain=="HERMES_LOCAL") -> "HERMES_CLOUD"
            else -> "NONE"
        }
    }
    val cloudPlanProvider=envField(s.brain,"CLOUD_PLAN_PROVIDER").ifBlank{
        when{
            cloudControlProvider=="GEMINI" && cloudState!="NOT_USED" && cloudState!="UNAVAILABLE" -> "GEMINI"
            cloudControlProvider=="HERMES_CLOUD" && cloudState!="NOT_USED" && cloudState!="UNAVAILABLE" -> "HERMES_CLOUD"
            else -> "NONE"
        }
    }
    val cloudInControl=when(cloudControlProvider.uppercase()){
        "GEMINI" -> "GEMINI"
        "HERMES_CLOUD","HERMES CLOUD" -> "HERMES CLOUD"
        else -> "NO"
    }
    val cloudPlan=when(cloudPlanProvider.uppercase()){
        "GEMINI" -> "GEMINI"
        "HERMES_CLOUD","HERMES CLOUD" -> "HERMES CLOUD"
        else -> "NOT_USED"
    }'''
          assert old in block
          block=block.replace(old,new,1)

          block=re.sub(r'\n    val lang=envField\(s\.thoughts,"LANGUAGE"\).*?\n    val langEngine=envField\(s\.thoughts,"LANGUAGE_ENGINE"\).*?\n','\n',block,count=1)

          old_body='''Cloud plan: $cloudState\n\n$thoughtTitle • $statusLabel\n$text\n\nThought source: ${thoughtSrc.ifBlank{"—"}}\nConfidence: ${conf.ifBlank{"—"}}%\nLanguage: $lang • $langEngine\n$mem'''
          new_body='''Cloud plan: $cloudPlan\n\n$thoughtTitle • $statusLabel\n$text\n\nThought source: ${thoughtSrc.ifBlank{"—"}}\nConfidence: ${conf.ifBlank{"—"}}%\n$mem'''
          assert old_body in block
          block=block.replace(old_body,new_body,1)

          M=M[:start]+block+M[end:]
          main.write_text(M)

          assert 'versionCode = 12261' in B
          B=B.replace('versionCode = 12261','versionCode = 12264',1)
          B=re.sub(r'versionName = "[^"]+"','versionName = "0.12.1-vc129659-ui1-fix33"',B,count=1)
          build.write_text(B)

          # Surgical gates.
          C=main.read_text()
          S=C[C.index('@Composable fun ThoughtsCard(s:RuntimeState)'):C.index('@Composable fun AgentRebuild3Card',C.index('@Composable fun ThoughtsCard(s:RuntimeState)'))]
          assert 'CLOUD_CONTROL_PROVIDER' in S
          assert 'CLOUD_PLAN_PROVIDER' in S
          assert 'Cloud in control: $cloudInControl' in S
          assert 'Cloud plan: $cloudPlan' in S
          assert 'Language: $lang' not in S
          assert 'val lang=' not in S and 'val langEngine=' not in S
          assert 'Memory:' in S
          assert 'versionCode = 12264' in build.read_text()
          print('VC129659_UI1_FIX33_SOURCE_GATE=PASS')
          PY

      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          set -euo pipefail
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Sign with official Android tools and verify
        run: |
          set -euo pipefail
          rm -rf dist-vc129659-ui1-fix33
          mkdir -p dist-vc129659-ui1-fix33
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          test -n "$U"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          "$BT/zipalign" -p -f 4 "$U" /tmp/aligned.apk

          PASS="$(openssl rand -hex 24)"
          ALIAS=djaeger-vc129659-ui1-fix33
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/vc129659-ui1-fix33.p12             -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650             -dname 'CN=DJAEGER VC129659 UI1 FIX33, O=DJAEGER, C=ID'

          APK=dist-vc129659-ui1-fix33/DJAEGER-Control-Center-v0.12.1-VC12264-VC129659-FREEZEFRAME1-CLOUDATTR1-UI1-FIX33.apk
          "$BT/apksigner" sign             --ks /tmp/vc129659-ui1-fix33.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS"             --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out "$APK" /tmp/aligned.apk

          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee dist-vc129659-ui1-fix33/APKSIGNER_VERIFY.txt
          "$BT/aapt" dump badging "$APK" | tee dist-vc129659-ui1-fix33/AAPT_BADGING.txt
          "$BT/zipalign" -c -v 4 "$APK" > dist-vc129659-ui1-fix33/ZIPALIGN_VERIFY.txt
          unzip -t "$APK" > dist-vc129659-ui1-fix33/ZIP_TEST.txt
          sha256sum "$APK" > dist-vc129659-ui1-fix33/SHA256.txt
          grep -q "package: name='com.djaeger.controlcenter'" dist-vc129659-ui1-fix33/AAPT_BADGING.txt
          grep -q "versionCode='12264'" dist-vc129659-ui1-fix33/AAPT_BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' dist-vc129659-ui1-fix33/APKSIGNER_VERIFY.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' dist-vc129659-ui1-fix33/APKSIGNER_VERIFY.txt

          cat > dist-vc129659-ui1-fix33/BUILD_REPORT.txt <<'EOF'
          STATUS=PASS
          PACKAGE_PARSE_GATE=AAPT_BADGING_PASS
          ZIPALIGN=PASS
          APK_SIGNATURE_V1=PASS
          APK_SIGNATURE_V2=PASS
          APK_SIGNATURE_V3=PASS
          VERSION_CODE=12264
          MODULE_TARGET=VC129659
          UI_LAYOUT_CHANGED=NO
          LANGUAGE_UI_REMOVED=YES
          CLOUD_CONTROL_PROVIDER_AWARE=YES
          CLOUD_PLAN_PROVIDER_AWARE=YES
          EOF

      - name: Publish verified APK to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist-vc129659-ui1-fix33
          git commit -m 'Publish VC129659 UI1 FIX33 verified APK [skip ci]'
          git push origin HEAD:codex/hermes-neuron-ask-shadow1-uifix1

      - uses: actions/upload-artifact@v4
        with:
          name: djaeger-vc129659-ui1-fix33
          path: dist-vc129659-ui1-fix33/
          if-no-files-found: error
          retention-days: 30
