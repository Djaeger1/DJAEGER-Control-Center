name: Build DJAEGER Control Center v0.12.1-r34
on:
  push:
    branches: [codex/v0.12.1-r34-cloudflare-truth-mapping]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate r34
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r23_groq_source_badge.py r24_groq_key_ui.py r25_thoughts_provider_chain.py r26_provider_chat_ui.py r27_equal_cloud_peers.py r28_badge_prepatch.py r28_cloudflare_peer.py r29_truth_attribution.py r30_human_strategy.py r31_dynamic_cloud_reasoning.py r32_runtime_truth_mapping.py r33_cloudflare_three_slots.py r34_cloudflare_truth_mapping.py; do python3 scripts/$s; done
      - name: r34 Cloudflare truth mapping gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          M=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          B=Path('control-center-r2/app/build.gradle.kts').read_text()
          A=Path('control-center-r2/app/src/main/AndroidManifest.xml').read_text()
          assert 'versionCode = 12340' in B
          assert 'versionName = "0.12.1-r34"' in B
          assert 'CONTROL CENTER • v0.12.1-r34 • CLOUDFLARE TRUTH MAPPING' in M
          # R33 3-slot UX preserved exactly: edit slots only, backend owns active selection.
          for x in ['Text("SLOT 1")','Text("SLOT 2")','Text("SLOT 3")','Text("SAVE SLOT")','Text("REMOVE SLOT")','sticky healthy → failover 401/403/429']:
              assert x in M, x
          assert 'Text("USE SLOT")' not in M
          assert 'CLOUDFLARE_SELECT' not in M
          assert 'selectCloudflareCredentialsSlot' not in R
          for x in ['cloudflare-credentials-vault-status','cloudflare-credentials-slot-stdin $slot','cloudflare-credentials-remove $slot']:
              assert x in R, x
          # R34 uses backend-published adaptive envelope truth only for Cloudflare.
          for x in ['val cfEnvelopeCurrent=','thoughtField(s.envelope,"local_validation")','thoughtField(s.envelope,"model_confidence_raw")','thoughtField(s.envelope,"resource_disposition")','CPU little: ${rangeView(littleRange,"kHz")}','Validasi Local AI: $validationTruth','Cloudflare raw: $rawCloudConfidence%']:
              assert x in M, x
          assert '— (PROFILE / tidak ada override numerik)' in M
          # Preserve R31 narrative, R32 truth mapping, and equal-peer contract.
          assert 'val publishedThoughtText=thoughtField(s.thoughts,"TEXT").trim()' in M
          assert 'cloudNarrativeFresh->"PEMIKIRAN $thoughtSource\\n$publishedThoughtText"' in M
          assert 'Decision source: ${x.source}' in M
          assert 'Learning confidence: $lc' in M
          for x in ['authority = s["AUTHORITY"].orEmpty(),','sessionSafety = s["SESSION_SAFETY"].orEmpty(),','supervisor = s["SUPERVISOR"].orEmpty(),']:
              assert x in C, x
          assert 'fun cloudIsActive(state:String)=state=="ACTIVE"' in M
          assert 'val providerLines="Active now: $activeNow\\nCloud active: $activeCloud\\nStrategy: $strategySource"' in M
          # No new recurring root read, no hardware/network authority, no leaked credentials.
          ss=R[R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'):R.index('    suspend fun setUserMode')]
          assert 'ConsolidatedSnapshotReader' in ss
          for forbidden in ['/sys/','cloudflare_2.conf','cloudflare_3.conf','cloudflare_active_slot']:
              assert forbidden not in ss, forbidden
          assert 'SYSTEM_ALERT_WINDOW' not in A
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9._-]{20,}',M+R+B+C)
          print('R34_CLOUDFLARE_TRUTH_MAPPING=PASS')
          print('R34_KEEP_NUMERIC_ENVELOPE_DISPLAY=PASS')
          print('R34_LOCAL_VALIDATION_TRUTH=PASS')
          print('R34_RAW_MODEL_CONFIDENCE_TRANSPARENCY=PASS')
          print('R34_R33_THREE_SLOT_UI_PRESERVED=PASS')
          print('R34_SINGLE_ATOMIC_ROOT_READ=PASS')
          PY
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r34
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r34.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r34.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r34.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r34.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r34.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r34.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r34-CLOUDFLARE-TRUTH-MAPPING
          path: output/*
          if-no-files-found: error
