name: HERMES WORK Release Channel
on:
  push:
    branches: [hermes-work-release-channel]
    paths:
      - 'hermes-work-runtime/**'
      - '.github/workflows/hermes-work-release.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Build ARMv7 runtime
        run: |
          set -eux
          cd hermes-work-runtime
          rm -rf out
          mkdir -p out/payload/bin out/payload/worker out/payload/config
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o out/payload/bin/workd ./workd.go
          cp manifest.json out/manifest.json
          cp worker/tick.sh out/payload/worker/tick.sh
          cp config/work.env out/payload/config/work.env
          cd out
          zip -qr ../HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip manifest.json payload
          cd ..
          sha256sum HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip | awk '{print $1}' > HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip.sha256
          cat > channel.json <<EOF
          {"channel":"stable","version":"v0.5.0-research-core","bundle":"HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip","sha256":"$(cat HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip.sha256)"}
          EOF
      - name: Publish channel files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-work-runtime/HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip hermes-work-runtime/HERMES_WORK_RUNTIME_v0.5.0_RESEARCH_CORE.zip.sha256 hermes-work-runtime/channel.json
          git commit -m "Publish HERMES WORK runtime v0.2.0" || exit 0
          git push
