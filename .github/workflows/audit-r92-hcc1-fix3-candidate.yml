name: Audit DJAEGER HCC1 FIX3 Baseline Candidate
on:
  push:
    branches: [codex/r92-hcc1-fix3-baseline-audit]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate exact HCC1 FULLSYNC FIX2 Control Center source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py; do
            python3 scripts/$s
          done
      - name: Static synchronization audit
        run: |
          set -euo pipefail
          mkdir -p audit_source
          cp control-center-r2/app/src/main/java/com/djaeger/controlcenter/{ConsolidatedRuntimeMapper.kt,ConsolidatedSnapshotReader.kt,DjaegerRepository.kt,MainActivity.kt,AtomicSnapshot.kt} audit_source/
          cp control-center-r2/app/src/main/AndroidManifest.xml audit_source/
          cp control-center-r2/app/build.gradle.kts audit_source/
          python3 - <<'PY' | tee audit_source/STATIC_AUDIT.txt
          from pathlib import Path
          import re
          root=Path('control-center-r2')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          S=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedSnapshotReader.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          A=(root/'app/src/main/AndroidManifest.xml').read_text()
          sections=sorted(set(re.findall(r's\["([A-Z0-9_]+)"\]',C)))
          print('APK_MAPPED_SECTIONS='+','.join(sections))
          print('APK_SECTION_COUNT='+str(len(sections)))
          vn=re.search(r'versionName\s*=\s*"([^"]+)"',B); vc=re.search(r'versionCode\s*=\s*(\d+)',B)
          print('VERSION_NAME='+(vn.group(1) if vn else 'NA'))
          print('VERSION_CODE='+(vc.group(1) if vc else 'NA'))
          print('SNAPSHOT_PATH_OK='+str('/data/adb/djaeger_ai/cc_snapshot' in S))
          snap=R[R.index('suspend fun snapshot'):R.index('suspend fun setUserMode')]
          print('SINGLE_RECURRING_READER_IN_SNAPSHOT_METHOD='+str('ConsolidatedSnapshotReader' in snap and 'ProcessBuilder' not in snap))
          print('GLOBAL_FAST_TELEMETRY_PROCESS='+str('fastTelemetry' in R and 'ProcessBuilder' in R and 'fast_telemetry' in R))
          print('JANK_NEGATIVE_SENTINEL='+str('val jank:Double=-1.0' in R and 'field(11).toDoubleOrNull()?:-1.0' in R))
          print('JANK_ZERO_VALID_UI='+str('jankText(s.telemetry.jank)' in M and 'value>=0.0' in M))
          print('HCC1_MAPPED='+str('HERMES_HUMAN_COMFORT' in C and 'hermesHumanComfort' in R and 'hermesHumanComfort' in M))
          print('HCC1_TYPED_CONTROLS='+str('djaeger-ai comfort $arg' in R and 'djaeger-ai feedback $arg' in R))
          print('CTX1_MAPPED='+str(all(x in C for x in ['HERMES_CTX1_STATUS','HERMES_CTX1_RUNTIME','HERMES_CTX1_SAFETY','HERMES_CTX1_HARDWARE','HERMES_CTX1_MEMORY','HERMES_CTX1_LEARNING'])))
          print('COG1_MAPPED='+str(all(x in C for x in ['HERMES_COGNITION_STATUS','HERMES_MEMORY_VNEXT','HERMES_REASONING_V2','HERMES_SKILLS_VNEXT','HERMES_LEARNING_V2','HERMES_RESEARCH_V2'])))
          print('AUTHORITY_MAPPED='+str(all(x in C for x in ['AUTHORITY','SESSION_SAFETY','SUPERVISOR'])))
          print('NETWORK_MAPPED='+str('NETWORK' in C))
          print('SYSTEM_ALERT_WINDOW='+str('SYSTEM_ALERT_WINDOW' in A))
          print('FORBIDDEN_NETWORK_MUTATION='+str(any(x in M+R for x in ['iptables','ip6tables','force-stop','settings put','setprop'])))
          st=M.index('@Composable fun Overview(s:RuntimeState)'); en=M.index('@Composable fun StatusCard',st); O=M[st:en]
          tokens=['ThoughtsCard(s);','Metric("FPS"','Metric("Frame"','Metric("Jank"','ThermalRow(s);','NetworkCard(s.network);','HermesCard(s);','HumanComfortHcc1Card(s);','ContextVNextCard(s);','MemoryVNextCard(s);','ReasoningV2Card(s);','SkillsVNextCard(s);','LearningResearchV2Card(s);','StrategyCard(s);','OutcomeLearningCard(s);']
          p=[O.index(x) for x in tokens]
          print('OVERVIEW_ORDER_OK='+str(p==sorted(p)))
          assert vn and vn.group(1)=='0.12.1-r22-r92ui6-fix2-cog1-hcc1-fullsync-fix2'
          assert vc and vc.group(1)=='12235'
          assert '/data/adb/djaeger_ai/cc_snapshot' in S
          assert 'val jank:Double=-1.0' in R and 'field(11).toDoubleOrNull()?:-1.0' in R
          assert 'jankText(s.telemetry.jank)' in M and 'value>=0.0' in M
          assert 'HERMES_HUMAN_COMFORT' in C and 'hermesHumanComfort' in R and 'hermesHumanComfort' in M
          assert p==sorted(p)
          assert 'SYSTEM_ALERT_WINDOW' not in A
          PY
      - name: Unit tests
        working-directory: control-center-r2
        run: gradle :app:testReleaseUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-HCC1-FIX3-BASELINE-AUDIT-SOURCE
          path: audit_source/*
          if-no-files-found: error
