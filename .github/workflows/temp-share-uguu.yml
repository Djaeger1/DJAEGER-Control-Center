name: TEMP SHARE CCSYNC1 APK UGUU
on:
  push:
    branches:
      - codex/rebuild3-hk1-sysfs1-ccsync1
jobs:
  share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK to Uguu and verify
        shell: bash
        run: |
          set -euo pipefail
          APK='dist-hk1-sysfs1-ccsync1/DJAEGER-Control-Center-v0.12.1-REBUILD3-HK1-SYSFS1-CCSYNC1.apk'
          test -s "$APK"
          EXPECT="$(sha256sum "$APK" | awk '{print $1}')"
          echo "SOURCE_APK_SHA256=$EXPECT"
          RESP="$(curl -fsS --retry 3 -F "files[]=@$APK" https://uguu.se/upload)"
          echo "UGUU_RESPONSE=$RESP"
          URL="$(printf '%s' "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); f=d.get("files") or []; print((f[0].get("url") if f else "") or "")')"
          test -n "$URL"
          curl -fL --retry 3 "$URL" -o verify.apk
          VERIFY="$(sha256sum verify.apk | awk '{print $1}')"
          test "$VERIFY" = "$EXPECT"
          echo "PUBLIC_APK_URL=$URL"
          echo "PUBLIC_APK_SHA256=$VERIFY"
