name: Build DJAEGER No-Reboot Recovery 2
on:
  push:
    branches: [codex/djaeger-no-reboot-recovery1]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Recovery safety gates
        run: |
          set -euo pipefail
          S=repair-no-reboot/app/src/main/assets/repair.sh
          U=repair-no-reboot/app/src/main/assets/djaeger-railway-updater-hotstack6-pidfix1
          grep -Fq 'DJAEGER NO-REBOOT RECOVERY2' "$S"
          grep -Fq 'BUNDLED_UPDATER_SELFTEST' "$S"
          grep -Fq "sts.al" "$S"
          grep -Fq 'CONTROLLER_BINARY=UNCHANGED' "$S"
          grep -Fq 'PREDICTOR_BINARY=UNCHANGED' "$S"
          grep -Fq 'PROFILE_MAP=UNCHANGED' "$S"
          grep -Fq 'NO_REBOOT=YES' "$S"
          grep -Fq '[ "$_old" != "$$" ]' "$U"
          grep -Fq 'printf '\''%s\\n'\'' "$$" >"$PIDFILE"' "$U"
          sh -n "$S"
          sh -n "$U"
          ! grep -Eq '(^|[[:space:]])(reboot|svc power reboot|setprop sys.powerctl)' "$S"
          ! grep -Eq 'cp .*controller\.sh|mv .*controller\.sh|cp .*predictor\.sh|mv .*predictor\.sh|game-profile-map\.conf.*(cp|mv)' "$S"
          echo SAFETY_GATE=PASS

      - name: Build release
        run: gradle -p repair-no-reboot :app:assembleRelease --stacktrace

      - name: Sign and verify
        run: |
          set -euo pipefail
          OUT=output-no-reboot-recovery
          mkdir -p "$OUT"
          U="$(find repair-no-reboot/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          test -n "$U"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$U" "$OUT/aligned.apk"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/recovery.p12 -storepass "$PASS" -keypass "$PASS" -alias djaeger-recovery -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER No-Reboot Recovery, O=DJAEGER, C=ID'
          APK="$OUT/DJAEGER_NO_REBOOT_RECOVERY1.apk"
          "$BT/apksigner" sign --ks /tmp/recovery.p12 --ks-type PKCS12 --ks-key-alias djaeger-recovery --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$APK" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$OUT/APKSIGNER_VERIFY.txt"
          "$BT/aapt" dump badging "$APK" | tee "$OUT/AAPT_BADGING.txt"
          "$BT/zipalign" -c -v 4 "$APK" > "$OUT/ZIPALIGN_VERIFY.txt"
          unzip -t "$APK" > "$OUT/ZIP_TEST.txt"
          grep -q "package: name='com.djaeger.norebootrecovery'" "$OUT/AAPT_BADGING.txt"
          grep -q "versionCode='1'" "$OUT/AAPT_BADGING.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$OUT/APKSIGNER_VERIFY.txt"
          sha256sum "$APK" > "$OUT/SHA256.txt"
          rm "$OUT/aligned.apk"
          printf '%s\n' 'STATUS=PASS' 'NO_REBOOT=YES' 'NO_FLASH=YES' 'CONTROLLER_BINARY=UNCHANGED' 'PREDICTOR_BINARY=UNCHANGED' 'PROFILE_MAP=UNCHANGED' 'ARCANE_REGISTRY_REASSERT=YES' 'UPDATER_REPAIR=BUNDLED_HOTSTACK6_PIDFIX1' > "$OUT/BUILD_REPORT.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: djaeger-no-reboot-recovery1
          path: output-no-reboot-recovery/
          if-no-files-found: error
          retention-days: 30
