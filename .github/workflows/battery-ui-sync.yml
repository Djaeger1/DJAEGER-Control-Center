name: Build DJAEGER Battery UI Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - battery-ui-sync-fix
    paths:
      - 'battery-ui-sync/**'
      - '.github/workflows/battery-ui-sync.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'battery-ui-sync/**'
      - '.github/workflows/battery-ui-sync.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: battery-ui-sync
        run: gradle --no-daemon :app:assembleRelease

      - name: Locate and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find battery-ui-sync/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Battery-UI-Sync-v1.0.0
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
