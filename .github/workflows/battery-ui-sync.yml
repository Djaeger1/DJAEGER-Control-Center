name: Build DJAEGER Battery UI Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - battery-ui-sync-fix
    paths:
      - 'battery-ui-sync/**'
      - '.github/workflows/battery-ui-sync.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'battery-ui-sync/**'
      - '.github/workflows/battery-ui-sync.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        working-directory: battery-ui-sync
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK exists
        run: test -f battery-ui-sync/app/build/outputs/apk/release/app-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Battery-UI-Sync-v1.0.0
          path: battery-ui-sync/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
