name: DJAEGER AI V6 Agent APK Sync

on:
  push:
    branches: [djaeger-ai-v6-agent-apk-sync]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djaeger-ai-v6-agent-apk-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify V6 UI authority contract
        run: |
          set -euo pipefail
          APP=observer-next/android/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          REPO=observer-next/android/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          GRADLE=observer-next/android/app/build.gradle.kts

          grep -Fq 'private val apkVersionCode=107' "$REPO"
          grep -Fq 'versionCode = 107' "$GRADLE"
          grep -Fq 'AI Agent is the sole DJAEGER hardware/SYSFS authority' "$APP"
          grep -Fq 'SYSFS execution: AI Agent only' "$APP"
          grep -Fq 'AGENT_EXECUTION_OWNER' "$APP"
          ! grep -Fq 'local gated executor only' "$APP"
          ! grep -Fq 'Only local validated executor may write' "$APP"
          ! grep -Fq 'LOCAL VALIDATED EXECUTOR' "$APP"
          ! grep -Fq 'LOCAL VALIDATOR / EXECUTOR OWNS HARDWARE' "$APP"

      - name: Android tests and release build
        working-directory: observer-next/android
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          mkdir -p out
          UNSIGNED="$(find observer-next/android/app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -n1)"
          test -n "$UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n1)"

          SIGN_DIR="$RUNNER_TEMP/djaeger-v6-agent-apk"
          mkdir -p "$SIGN_DIR"
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"

          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$SIGN_DIR/djaeger-v6.p12" \
            -storepass "$PASS" -keypass "$PASS" \
            -alias djaegerai -keyalg RSA -keysize 4096 -validity 3650 \
            -dname 'CN=DJAEGER AI V6, O=DJAEGER, C=ID'

          ALIGNED="$RUNNER_TEMP/djaeger-v6-agent-aligned.apk"
          APK="out/DJAEGER-AI-Control-Center-v1.1.3-V6-AGENT-SYNC.apk"

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$SIGN_DIR/djaeger-v6.p12" --ks-type PKCS12 \
            --ks-key-alias djaegerai \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/APKSIGNER_VERIFY.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/AAPT_BADGING.txt
          "$APKANALYZER" manifest debuggable "$APK" | tee out/APK_DEBUGGABLE.txt
          unzip -t "$APK" > out/APK_ZIP_TEST.txt

          grep -q "package: name='com.djaeger.observer' versionCode='107'" out/AAPT_BADGING.txt
          grep -qx 'false' out/APK_DEBUGGABLE.txt

          sha256sum "$APK" > out/SHA256SUMS.txt
          printf '%s\n' \
            'STATUS=V6_AGENT_UI_SYNC_BUILT' \
            'APK_VERSION_CODE=107' \
            'MODULE_EXPECTED_VERSION_CODE=206' \
            'HANDSHAKE=DJAEGER_AI_ADAPTIVE_V2' \
            'SYSFS_UI_AUTHORITY=AI_AGENT_ONLY' \
            'APK_HARDWARE_WRITES=NONE' \
            > out/BUILD_REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-AI-Control-Center-V6-AGENT-SYNC
          path: |
            out/DJAEGER-AI-Control-Center-v1.1.3-V6-AGENT-SYNC.apk
            out/SHA256SUMS.txt
            out/BUILD_REPORT.txt
            out/APKSIGNER_VERIFY.txt
            out/AAPT_BADGING.txt
            out/APK_DEBUGGABLE.txt
            out/APK_ZIP_TEST.txt
          if-no-files-found: error
