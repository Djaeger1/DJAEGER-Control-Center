name: Build DJAEGER Control Center APK

on:
  push:
    branches: [main]
    paths:
      - 'observer-next/**'
      - '.github/workflows/build-control-center-temporary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'observer-next/**'
      - '.github/workflows/build-control-center-temporary.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-control-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify Control Center source
        run: |
          test -f observer-next/android/settings.gradle.kts
          test -f observer-next/android/app/build.gradle.kts
          test -f observer-next/android/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'DJAEGER' observer-next/android/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt

      - name: Build release APK
        working-directory: observer-next/android
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Sign APK
        id: sign
        run: |
          set -euo pipefail
          UNSIGNED="$(find observer-next/android/app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -n1)"
          test -n "$UNSIGNED"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          SIGN_DIR="$RUNNER_TEMP/djaeger-cc-signing"
          mkdir -p "$SIGN_DIR"
          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype PKCS12             -keystore "$SIGN_DIR/djaeger-cc.p12"             -storepass "$PASS" -keypass "$PASS"             -alias djaegercc -keyalg RSA -keysize 4096 -validity 3650             -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$SIGN_DIR/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign             --ks "$SIGN_DIR/djaeger-cc.p12" --ks-type PKCS12             --ks-key-alias djaegercc             --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out "$GITHUB_WORKSPACE/DJAEGER-Control-Center-v1.0.0-adaptive-clean.apk"             "$SIGN_DIR/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs             "$GITHUB_WORKSPACE/DJAEGER-Control-Center-v1.0.0-adaptive-clean.apk"
          sha256sum "$GITHUB_WORKSPACE/DJAEGER-Control-Center-v1.0.0-adaptive-clean.apk"             | tee "$GITHUB_WORKSPACE/DJAEGER-Control-Center-v1.0.0-adaptive-clean.apk.sha256"

      - name: Publish APK to build branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build-output
          cp DJAEGER-Control-Center-v1.0.0-adaptive-clean.apk build-output/
          cp DJAEGER-Control-Center-v1.0.0-adaptive-clean.apk.sha256 build-output/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/
          git commit -m "Build Control Center APK"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            git push origin "HEAD:${{ github.ref_name }}"
          fi
