name: Build DJAEGER Control Center v0.12.1-r7 Layout Final
on:
  push:
    branches: [codex/v0.12.1-r3-root-vault]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Apply r4 baseline plus r7 final Network card
        run: |
          awk '/python3 - <<.PY./{f=1;next} f&&/^          PY$/{exit} f{sub(/^          /,"");print}' .github/workflows/build-control-center-r4.yml >/tmp/r4.py
          python3 /tmp/r4.py
          python3 - <<'PY'
          from pathlib import Path
          bp=Path('control-center-r2/app/build.gradle.kts')
          b=bp.read_text().replace('versionCode = 12104','versionCode = 12107').replace('versionName = "0.12.1-r4"','versionName = "0.12.1-r7"')
          bp.write_text(b)
          rp=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt')
          r=rp.read_text()
          r=r.replace('data class RuntimeState(', 'data class NetworkState(val ping:String="—",val avg:String="—",val p95:String="—",val jitter:String="—",val loss:String="—",val quality:String="STALE/INACTIVE",val fresh:Boolean=false)\n\ndata class RuntimeState(')
          r=r.replace('val error:String=""', 'val error:String="",val network:NetworkState=NetworkState()')
          r=r.replace("echo __TEL__; tail -n 1 '$module/telemetry.csv' 2>/dev/null", "echo __TEL__; tail -n 1 '$module/telemetry.csv' 2>/dev/null\n        echo __NETWORK__; cat '$persistent/network_status' 2>/dev/null")
          r=r.replace('val csv=parseTelemetry(section("TEL","LIVE").trim())','val csv=parseTelemetry(section("TEL","NETWORK").trim())\n        val networkRaw=section("NETWORK","LIVE").trim()\n        fun cleanNet(v:String?):String{val x=v?.trim().orEmpty();return if(x.length>=2&&((x.first()==\'\\\'\'&&x.last()==\'\\\'\')||(x.first()==\'"\'&&x.last()==\'"\')))x.substring(1,x.length-1) else x}\n        val nkv=networkRaw.lineSequence().mapNotNull{line->val p=line.indexOf(\'=\');if(p<=0)null else line.substring(0,p).trim() to cleanNet(line.substring(p+1))}.toMap()\n        val nowNet=System.currentTimeMillis()/1000; val netAt=nkv["UPDATED_AT"]?.toLongOrNull()?:0L\n        val netFresh=nkv["SESSION_ACTIVE"]=="1"&&netAt>0&&(nowNet-netAt) in 0..30\n        val network=if(netFresh) NetworkState(nkv["PING_CURRENT_MS"]?:"—",nkv["PING_AVG_MS"]?:"—",nkv["PING_P95_MS"]?:"—",nkv["JITTER_MS"]?:"—",nkv["PACKET_LOSS_PCT"]?:"—",nkv["QUALITY"]?:"UNKNOWN",true) else NetworkState()')
          r=r.replace('error=err)', 'error=err,network=network)')
          rp.write_text(r)
          mp=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt')
          s=mp.read_text()
          s=s.replace('CONTROL CENTER • v0.12.1-r4 • ${state.moduleVersion} • MATCHED STACK • ROOT RESILIENT • KEY VAULT','CONTROL CENTER • v0.12.1-r7 • ${state.moduleVersion} • NETWORK INTELLIGENCE • KEY VAULT')
          s=s.replace('ThermalRow(s);BoxCard("PERFORMANCE"', 'ThermalRow(s);NetworkCard(s.network);BoxCard("PERFORMANCE"')
          marker='@Composable fun ThermalRow(s:RuntimeState)'
          idx=s.index(marker)
          network='''@Composable fun NetworkCard(n:NetworkState){\n    val clipboard=LocalClipboardManager.current\n    val body="Ping ${n.ping} ms • Avg ${n.avg} ms • P95 ${n.p95} ms • Jitter ${n.jitter} ms • Loss ${n.loss}% • Quality ${n.quality}"\n    Card(Modifier.fillMaxWidth(),colors=CardDefaults.cardColors(containerColor=Card),shape=RoundedCornerShape(14.dp)){Column(Modifier.padding(14.dp)){\n        Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){Text("NETWORK",color=Green,fontWeight=FontWeight.Bold);TextButton(onClick={clipboard.setText(AnnotatedString(body))}){Text("COPY")}}\n        Row(Modifier.fillMaxWidth(),horizontalArrangement=Arrangement.SpaceBetween){NetworkMetric("Ping",if(n.fresh) "${n.ping} ms" else "—");NetworkMetric("Avg",if(n.fresh) "${n.avg} ms" else "—");NetworkMetric("P95",if(n.fresh) "${n.p95} ms" else "—");NetworkMetric("Jitter",if(n.fresh) "${n.jitter} ms" else "—");NetworkMetric("Loss",if(n.fresh) "${n.loss}%" else "—")}\n        Spacer(Modifier.height(8.dp));Text("Quality: ${n.quality}",color=if(n.fresh) Green else Muted,fontWeight=FontWeight.Bold)\n    }}\n}\n@Composable fun NetworkMetric(label:String,value:String){Column{Text(label,color=Muted,style=MaterialTheme.typography.labelMedium);Text(value,fontWeight=FontWeight.Bold,style=MaterialTheme.typography.bodyMedium)}}\n\n'''
          s=s[:idx]+network+s[idx:]
          mp.write_text(s)
          PY
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify and audit
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-r7-final
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r7.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r7.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence-LayoutFinal.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence-LayoutFinal.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence-LayoutFinal.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence-LayoutFinal.apk > output/SHA256SUMS.txt
          rm output/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence-LayoutFinal
          path: output/*
          if-no-files-found: error
          retention-days: 30
