name: Shadow DJAEGER Hermes Neuron Ask
on:
  push:
    branches: [codex/hermes-neuron-ask-shadow1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shadow-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}

      - name: Rebuild exact WORKLOADFINAL1 baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py; do python3 scripts/$s; done
          python3 scripts/r34_rebuild3_agent_full_hardware_truth.py
          python3 scripts/r35_rebuild3_lang2_mwfix1.py
          python3 scripts/r36_rebuild3_lang3_math1_sync1.py
          python3 scripts/r37_sync2_session_truth_ui_order.py
          python3 scripts/r38_mwfix2_sync3.py
          python3 scripts/r39_attr1_sync4.py
          python3 scripts/r40_hk1_sysfs1_ccsync1.py
          python3 scripts/r41_loopfix1_ccmatch1.py
          python3 scripts/r42_gamereg1.py
          python3 scripts/r43_sharedint1.py
          python3 scripts/r44_hermescloud1.py
          python3 scripts/r45_workloadfinal1.py
          python3 scripts/r46_workloadfinal1_overview_order_fix.py
          cp -a control-center-r2 /tmp/pre-r50

      - name: Apply R50 only in shadow
        run: |
          set -euo pipefail
          python3 scripts/r50_hermes_neuron_ask1.py

      - name: Offline structural and regression gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('control-center-r2'); old=Path('/tmp/pre-r50')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          assert 'versionCode = 12261' in B
          assert 'neurongov1-askhermes1' in B
          assert 'Ask DJAEGER Gemini' in M
          assert 'Ask DJAEGER Hermes' in M
          assert 'HERMES CONVERSATION' in M
          assert 'HERMES: $online' in M
          assert 'HERMES_NEURON_USED_EST' in M
          assert 'HERMES_NEURON_LIMIT' in M
          assert 'HERMES_NEURON_TIER' in M
          assert 'djaeger-hermes-cloud chat-stdin' in R
          assert 'djaeger-hermes-cloud chat-clear' in R
          assert '/sys/' not in R and '/proc/sys/' not in R
          ov=M[M.index('@Composable fun Overview(s:RuntimeState)'):M.index('private fun compactModuleVersion',M.index('@Composable fun Overview(s:RuntimeState)'))]
          expected=['StatusCard(s)','ThoughtsCard(s)','Metric("FPS"','ThermalRow(s)','NetworkCard(s.network)','StrategyCard(s)','HermesStatusCard(s)','AgentRebuild3Card(s)','HermesCloudCard(s)','KernelAgentSyncCard(s)','HermesCard(s)','HumanComfortHcc1Card(s)','ContextVNextCard(s)','MemoryVNextCard(s)','ReasoningV2Card(s)','SkillsVNextCard(s)','LearningResearchV2Card(s)','OutcomeLearningCard(s)','StrategyCompositionCard(s)','DecisionPipelineCard(s)','BoxCard("PERFORMANCE"','BoxCard("POWER"','BoxCard("FRAME INTELLIGENCE • RECENT"','WorkloadIntelligenceCard(s)']
          pos=[ov.index(x) for x in expected]
          assert pos==sorted(pos),pos
          assert ov.count('HermesStatusCard(s)')==1
          assert ov.index('StrategyCard(s)') < ov.index('HermesStatusCard(s)') < ov.index('AgentRebuild3Card(s)')
          ai=M[M.index('@Composable fun AI(s:RuntimeState)'):M.index('private fun aiSummary',M.index('@Composable fun AI(s:RuntimeState)'))]
          assert ai.count('Ask DJAEGER Gemini')==1
          assert ai.count('Ask DJAEGER Hermes')==1
          assert ai.index('Ask DJAEGER Gemini') < ai.index('GEMINI CONVERSATION') < ai.index('Ask DJAEGER Hermes') < ai.index('HERMES CONVERSATION')
          assert 'ASK GEMINI' in ai and 'ASK HERMES' in ai
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before={p.relative_to(old).as_posix():h(p) for p in old.rglob('*') if p.is_file()}
          after={p.relative_to(root).as_posix():h(p) for p in root.rglob('*') if p.is_file()}
          changed=sorted(k for k in before.keys()&after.keys() if before[k]!=after[k])
          allowed=sorted(['app/build.gradle.kts','app/src/main/java/com/djaeger/controlcenter/MainActivity.kt','app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt'])
          assert changed==allowed,(changed,allowed)
          assert set(before)==set(after)
          print('SHADOW_R50_GATE=PASS')
          print('OVERVIEW_ORDER_PRESERVED=PASS')
          print('HERMES_STATUS_POSITION=IMMEDIATELY_AFTER_STRATEGY')
          print('ASK_HERMES_POSITION=BELOW_ASK_GEMINI')
          print('GEMINI_PATH_PRESERVED=PASS')
          print('APP_HERMES_DIRECT_NETWORK=NONE')
          print('APP_HERMES_DIRECT_SYSFS=NONE')
          print('R50_CHANGED_FILES=3')
          PY

      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          set -euo pipefail
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Sign verify and package shadow output
        run: |
          set -euo pipefail
          rm -rf dist-hermes-neuron-ask-shadow1 output-hermes-neuron-ask-shadow1
          mkdir -p dist-hermes-neuron-ask-shadow1 output-hermes-neuron-ask-shadow1
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          test -n "$U"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$U" output-hermes-neuron-ask-shadow1/aligned.apk
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-hermes-neuron-ask-shadow1
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/hermes-neuron-ask-shadow1.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER HERMES NEURON ASK SHADOW1, O=DJAEGER, C=ID'
          APK=dist-hermes-neuron-ask-shadow1/DJAEGER-Control-Center-v0.12.1-HERMES-NEURON-ASK-SHADOW1.apk
          "$BT/apksigner" sign --ks /tmp/hermes-neuron-ask-shadow1.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out "$APK" output-hermes-neuron-ask-shadow1/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > dist-hermes-neuron-ask-shadow1/APK_VERIFY.txt
          unzip -t "$APK" > dist-hermes-neuron-ask-shadow1/APK_ZIP_TEST.txt
          sha256sum "$APK" > dist-hermes-neuron-ask-shadow1/SHA256.txt
          cat > dist-hermes-neuron-ask-shadow1/SHADOW_TEST_REPORT.txt <<'EOF'
          STATUS=PASS
          BASELINE=WORKLOADFINAL1
          MODULE_TARGET=HERMESCLOUD1-WORKLOADFINAL1-CLOUDFAILSAFE1-NEURONGOV1-ASKHERMES1
          OVERVIEW_ORDER_PRESERVED=YES
          HERMES_STATUS_POSITION=IMMEDIATELY_AFTER_STRATEGY
          ASK_HERMES_POSITION=BELOW_ASK_GEMINI
          GEMINI_PATH_CHANGED=NO
          HERMES_CHAT_TRANSPORT=MODULE_HELPER_ONLY
          DIRECT_APP_NETWORK_FOR_HERMES=NONE
          DIRECT_APP_SYSFS_FOR_HERMES=NONE
          CONTROL_CENTER_VERSION_CODE=12261
          EOF

      - name: Publish verified shadow output to shadow branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist-hermes-neuron-ask-shadow1
          git commit -m 'Publish verified HERMES NEURON ASK shadow APK [skip ci]'
          git push origin HEAD:codex/hermes-neuron-ask-shadow1
