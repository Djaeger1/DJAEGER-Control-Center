# r13-encrypted-vault-compile-fixed
name: Build DJAEGER Control Center v0.12.1-r13 Complete
on:
  push:
    branches: [codex/v0.12.1-r13-complete-user-design]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate r11 baseline and apply complete design
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          python3 scripts/r9_cutover_repository.py
          python3 scripts/r9_integrate_bug_health.py
          python3 scripts/r10_integrate_manual_refresh.py
          python3 scripts/r10_1_idle_semantics.py
          python3 scripts/r10_2_freshness_semantics.py
          python3 scripts/r11_surgical_remove_ui.py
          python3 scripts/r12_user_design_additive.py
          python3 scripts/r13_complete_user_design.py
      - name: Strict regression and safety gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          M=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text(); R=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text(); K=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/KeyVault4.kt').read_text(); A=Path('control-center-r2/app/src/main/AndroidManifest.xml').read_text(); B=Path('control-center-r2/app/build.gradle.kts').read_text()
          assert 'versionName = "0.12.1-r13"' in B
          for x in ['setUserMode','saveGeminiKey','deleteGeminiKey','geminiChat','NetworkCard','manualRefresh','BugHealth','STRATEGY COMPOSITION','DECISION PIPELINE','OUTCOME + LEARNING','4 MANUAL SLOTS','429 never rotates','SAVE SLOT','DELETE SLOT']: assert x in M,x
          for x in ['StrategyTruth','DECISION_SOURCE','CPU_LITTLE_MIN','CPU_BIG_MAX','GPU_MIN','GPU_MAX','LEARNING_SAMPLES','LEARNING_CONFIDENCE','ConsolidatedSnapshotReader']: assert x in R,x
          for x in ['AndroidKeyStore','AES/GCM/NoPadding','s$slot']: assert x in K,x
          assert 'SYSTEM_ALERT_WINDOW' not in A and 'R78 SYNC' not in M
          a=R.index('suspend fun snapshot()'); b=R.index('suspend fun setUserMode',a); q=R[a:b]
          for bad in ['/sys/','iptables','nft ','ip route','setprop net.']: assert bad not in q,bad
          import re; assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+K+B)
          print('R13_COMPLETE_REGRESSION=PASS')
          PY
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r13
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r13.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r13.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r13-CompleteUserDesign.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r13-CompleteUserDesign.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r13-CompleteUserDesign.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r13-CompleteUserDesign.apk > output/SHA256SUMS.txt
          rm output/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r13-CompleteUserDesign
          path: output/*
          if-no-files-found: error
          retention-days: 30
