name: TEMP ARTIFACT CCSYNC1 APK
on:
  push:
    branches:
      - codex/rebuild3-hk1-sysfs1-ccsync1
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check APK
        shell: bash
        run: |
          set -euo pipefail
          APK='dist-hk1-sysfs1-ccsync1/DJAEGER-Control-Center-v0.12.1-REBUILD3-HK1-SYSFS1-CCSYNC1.apk'
          test -s "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-vc12258
          path: dist-hk1-sysfs1-ccsync1/DJAEGER-Control-Center-v0.12.1-REBUILD3-HK1-SYSFS1-CCSYNC1.apk
          compression-level: 0
          retention-days: 1
