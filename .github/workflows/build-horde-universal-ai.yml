name: Build Horde Universal AI

on:
  workflow_dispatch:
  push:
    paths:
      - "horde-android/**"
      - ".github/workflows/build-horde-universal-ai.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle -p horde-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Horde-Universal-AI-debug
          path: horde-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
