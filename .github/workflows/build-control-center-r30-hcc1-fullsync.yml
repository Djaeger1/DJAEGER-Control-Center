name: Build DJAEGER Control Center UI6 COG1 HCC1 FullSync
on:
  push:
    branches: [codex/r92-ui6-cog1-hcc1-fullsync]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}

      - name: Generate proven UI6 COG1 OverviewOrder plus HCC1 FullSync
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py; do
            python3 scripts/$s
          done

      - name: Exact HCC1 module Control Center sync gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('control-center-r2')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          A=(root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'versionName = "0.12.1-r22-r92ui6-fix2-cog1-hcc1-fullsync"' in B
          assert 'versionCode = 12234' in B
          assert 's["HERMES_HUMAN_COMFORT"]' in C
          assert 'hermesHumanComfort' in C and 'hermesHumanComfort' in R and 'hermesHumanComfort' in M
          assert 'djaeger-ai comfort $arg' in R
          assert 'djaeger-ai feedback $arg' in R
          for token in ['"COOL_STABLE"->"cool-stable"','"BASELINE"->"baseline"','"RESET"->"reset"','"VERY_COMFORTABLE"->"very-comfortable"','"COMFORTABLE"->"comfortable"','"LESS_COMFORTABLE"->"less-comfortable"','"UNCOMFORTABLE"->"uncomfortable"']:
              assert token in R, token
          start=M.index('@Composable fun Overview(s:RuntimeState)'); end=M.index('@Composable fun StatusCard',start); O=M[start:end]
          required=['ThoughtsCard(s);','Metric("FPS"','Metric("Frame"','Metric("Jank"','ThermalRow(s);','NetworkCard(s.network);','HermesCard(s);','HumanComfortHcc1Card(s);','ContextVNextCard(s);']
          pos=[O.index(x) for x in required]
          assert pos==sorted(pos)
          for token in ['HUMAN COMFORT HCC1 CONTROL','COOL STABLE','BASELINE','RESET','SANGAT NYAMAN','KURANG NYAMAN','TIDAK NYAMAN']:
              assert token in M, token
          snap=R[R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'):R.index('    suspend fun setUserMode',R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'))]
          assert 'ConsolidatedSnapshotReader' in snap
          assert 'hermesHumanComfort=mapped.hermesHumanComfort' in snap
          for forbidden in ['/sys/','human_comfort_runtime.conf','human_comfort_memory.tsv','djaeger-ai comfort','djaeger-ai feedback','ProcessBuilder']:
              assert forbidden not in snap, forbidden
          assert 'SYSTEM_ALERT_WINDOW' not in A
          for forbidden in ['iptables','ip6tables',' force-stop','settings put','setprop','/sys/class/']:
              assert forbidden not in M
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+C+B)
          print('HCC1_FIRST_CLASS_SECTION=PASS')
          print('HCC1_TYPED_PRESET_CONTROL=PASS')
          print('HCC1_TYPED_FEEDBACK_CONTROL=PASS')
          print('OVERVIEW_ORDER=THOUGHT>METRICS>THERMALS>NETWORK>HERMES_H2>HCC1>CTX1')
          print('SINGLE_ATOMIC_ROOT_READ=PRESERVED')
          print('HARDWARE_AUTHORITY_CHANGE=NONE')
          print('NETWORK_GAME_TRAFFIC_CHANGE=NONE')
          PY

      - name: Test and build release
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: APK safety scan
        run: |
          set -euo pipefail
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          test -n "$U"
          unzip -t "$U" >/tmp/apk_zip_test.txt
          strings "$U" > /tmp/apk_strings.txt || true
          ! grep -E 'iptables|ip6tables|force-stop|settings put|setprop' /tmp/apk_strings.txt
          echo APK_PRE_SIGN_SAFETY=PASS

      - name: Sign verify and hash
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r92ui6-hcc1-fullsync
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r92ui6-hcc1-fullsync.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center UI6 COG1 HCC1 FullSync, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r92ui6-hcc1-fullsync.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC.apk > output/APK_ZIP_TEST.txt
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf '%s\n' 'BASELINE=UI6_FIX2_RT3_FIX2_COG1_OVERVIEWORDER' 'HCC1_FIRST_CLASS_SECTION=HERMES_HUMAN_COMFORT' 'HCC1_PRESET_CONTROL=COOL_STABLE+BASELINE+RESET' 'HCC1_FEEDBACK_CONTROL=VERY_COMFORTABLE+COMFORTABLE+LESS_COMFORTABLE+UNCOMFORTABLE' 'CONTROL_PATH=TYPED_DJAEGER_AI_ONLY' 'SINGLE_ATOMIC_CC_SNAPSHOT_READ=PRESERVED' 'HARDWARE_AUTHORITY_CHANGE=NONE' 'NETWORK_GAME_TRAFFIC_CHANGE=NONE' > output/BUILD_CONTRACT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC
          path: output/*
          if-no-files-found: error
