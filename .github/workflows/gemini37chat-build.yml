name: Build Gemini 3.7 Chat APK

on:
  push:
    branches: [gemini37chat-build]
    paths:
      - 'gemini37chat/**'
      - '.github/workflows/gemini37chat-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          rm -rf /tmp/gemini37build
          mkdir -p /tmp/gemini37build
          unzip -q gemini37chat/Gemini37Chat_Source.zip -d /tmp/gemini37build
          test -f /tmp/gemini37build/Gemini37Chat/settings.gradle

      - name: Build debug APK
        working-directory: /tmp/gemini37build/Gemini37Chat
        run: gradle :app:assembleDebug --stacktrace

      - name: Store APK on isolated build branch
        run: |
          mkdir -p gemini37chat/releases
          cp /tmp/gemini37build/Gemini37Chat/app/build/outputs/apk/debug/app-debug.apk gemini37chat/releases/Gemini37Chat-v1.0-debug.apk
          sha256sum gemini37chat/releases/Gemini37Chat-v1.0-debug.apk > gemini37chat/releases/SHA256.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gemini37chat/releases/Gemini37Chat-v1.0-debug.apk gemini37chat/releases/SHA256.txt
          git commit -m "Store built Gemini 3.7 Chat APK [skip ci]"
          git push origin HEAD:gemini37chat-build
