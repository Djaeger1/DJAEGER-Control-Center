name: Build DJAEGER Control Center MWFIX1
on:
  push:
    branches: [codex/rebuild3-lang2-mwfix1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}

      - name: Generate exact FIX4 RC1 baseline then apply REBUILD3 + MWFIX1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py; do
            python3 scripts/$s
          done
          python3 scripts/r34_rebuild3_agent_full_hardware_truth.py
          python3 scripts/r35_rebuild3_lang2_mwfix1.py

      - name: MWFIX1 architecture and regression gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('control-center-r2')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          A=(root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'versionCode = 12253' in B
          assert '0.12.1-rebuild3-lang2-mwfix1' in B
          assert 'activeClaim && runtimeFresh && fFresh' in R
          assert 'else "NA (STALE)"' not in R
          assert 'else "STALE"' not in R
          assert 'state.active=="1"&&state.sampleFresh' in M
          assert 'Engine: $engine • age $ageText' in M
          assert 'Session: $sessionState' in M
          assert 'compactModuleVersion' in M
          assert 'CONTROL CENTER • REBUILD3 • LANG2 • MWFIX1' in M
          # Preserve REBUILD3 authority semantics and atomic snapshot transport.
          for x in ['AI AGENT • FULL HARDWARE CONTROLLER','Must obey active brain: $mustObey','Can choose brain: $canChoose','Can override brain: $canOverride','GEMINI • PRIMARY / HIGHEST','HERMES H2 • DEPUTY LOCAL BRAIN']:
              assert x in M,x
          assert 'AGENT_WINNER' not in M
          assert 'LOCAL AI' not in M
          snap=R[R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'):R.index('    suspend fun setUserMode',R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'))]
          assert 'ConsolidatedSnapshotReader' in snap
          assert 'SYSTEM_ALERT_WINDOW' not in A
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+C+B)
          print('MWFIX1_FROM_REBUILD3=PASS')
          print('MWFIX1_IDLE_PROFILE_HISTORY_LEAK=FIXED')
          print('MWFIX1_STALE_GAME_WINDOW_MIX=FIXED')
          print('MWFIX1_ENGINE_SESSION_SEMANTICS=PASS')
          print('MWFIX1_REBUILD3_AUTHORITY_PRESERVED=PASS')
          PY

      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Sign verify and publish MWFIX1
        run: |
          set -euo pipefail
          rm -rf dist-mwfix1 audit-mwfix1 output-mwfix1
          mkdir -p dist-mwfix1 audit-mwfix1/src output-mwfix1
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$U" output-mwfix1/aligned.apk
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-mwfix1-ci
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/mwfix1.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER MWFIX1, O=DJAEGER, C=ID'
          "$BT/apksigner" sign --ks /tmp/mwfix1.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out dist-mwfix1/DJAEGER-Control-Center-v0.12.1-REBUILD3-LANG2-MWFIX1.apk output-mwfix1/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs dist-mwfix1/DJAEGER-Control-Center-v0.12.1-REBUILD3-LANG2-MWFIX1.apk > dist-mwfix1/APK_VERIFY.txt
          unzip -t dist-mwfix1/DJAEGER-Control-Center-v0.12.1-REBUILD3-LANG2-MWFIX1.apk > dist-mwfix1/APK_ZIP_TEST.txt
          sha256sum dist-mwfix1/DJAEGER-Control-Center-v0.12.1-REBUILD3-LANG2-MWFIX1.apk > dist-mwfix1/SHA256.txt
          printf '%s\n' \
            'SOURCE_REBUILD3_COMMIT=d63a86392af1bc8be464f0fa20f500260108cc51' \
            'SOURCE_FIX4_BASELINE_COMMIT=93c78ff2808022d176d9e08c17be4e488f5ab125' \
            'MATCHED_MODULE_VERSION_CODE=129625' \
            'CONTROL_CENTER_VERSION_CODE=12253' \
            'FIX=MIUI_FREEFORM_SESSION_AND_IDLE_PROFILE_TRUTH' \
            'PRIMARY_BRAIN=GEMINI' \
            'DEPUTY_LOCAL_BRAIN=HERMES_H2' \
            'AGENT_HARDWARE_AUTHORITY=FULL' \
            'AGENT_DECISION_AUTHORITY=NONE' \
            'THIRD_BRAIN=NONE' \
            'SIGNER=MWFIX1_CI' > dist-mwfix1/BUILD_CONTRACT.txt
          cp -a control-center-r2/app/src/main/java/com/djaeger/controlcenter/. audit-mwfix1/src/
          cp control-center-r2/app/build.gradle.kts audit-mwfix1/
          cp control-center-r2/app/src/main/AndroidManifest.xml audit-mwfix1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist-mwfix1 audit-mwfix1
          git commit -m 'Publish REBUILD3 LANG2 MWFIX1 [skip ci]'
          git push origin HEAD:codex/rebuild3-lang2-mwfix1
