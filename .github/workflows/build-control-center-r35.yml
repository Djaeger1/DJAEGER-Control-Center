name: Build DJAEGER Control Center v0.12.1-r35
on:
  push:
    branches: [codex/v0.12.1-r35-proposal-execution-truth]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate r35
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r23_groq_source_badge.py r24_groq_key_ui.py r25_thoughts_provider_chain.py r26_provider_chat_ui.py r27_equal_cloud_peers.py r28_badge_prepatch.py r28_cloudflare_peer.py r29_truth_attribution.py r30_human_strategy.py r31_dynamic_cloud_reasoning.py r32_runtime_truth_mapping.py r33_cloudflare_three_slots.py r34_cloudflare_truth_mapping.py r35_cloudflare_proposal_execution_truth.py; do python3 scripts/$s; done
      - name: r35 proposal/execution truth gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          M=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          B=Path('control-center-r2/app/build.gradle.kts').read_text()
          assert 'versionCode = 12350' in B
          assert 'versionName = "0.12.1-r35"' in B
          for x in ['CONTROL CENTER • v0.12.1-r35 • PROPOSAL / EXECUTION TRUTH','val cloudProposalCurrent=','proposal_validation','execution_owner','numeric_envelope','Validasi proposal: $validationTruth','Strategi aktif: $strategySource','Pemilik eksekusi: $executionTruth','KEEP PROFILE / Local AI tetap aktif']:
              assert x in M,x
          assert 'Validasi Local AI: $validationTruth' not in M
          for x in ['Text("SLOT 1")','Text("SLOT 2")','Text("SLOT 3")','sticky healthy → failover 401/403/429']:
              assert x in M,x
          print('R35_PROPOSAL_EXECUTION_TRUTH=PASS')
          print('R35_R34_TRUTH_MAPPING_PRESERVED=PASS')
          print('R35_R33_THREE_SLOT_UI=PRESERVED')
          PY
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r35
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r35.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r35.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r35.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r35.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r35.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r35.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r35-PROPOSAL-EXECUTION-TRUTH
          path: output/*
          if-no-files-found: error
