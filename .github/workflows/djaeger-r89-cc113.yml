name: DJAEGER R89 Control Center 113

on:
  push:
    branches: [r89-current-apk-compat]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: djaeger-r89-cc113
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Verify R89 CC113 contract
        run: |
          set -euo pipefail
          APP=observer-next/android/app/build.gradle.kts
          UI=observer-next/android/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          REPO=observer-next/android/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          grep -Fq 'versionCode = 113' "$APP"
          grep -Fq 'versionName = "1.1.9-r89-cc113"' "$APP"
          grep -Fq 'private val apkVersionCode=113' "$REPO"
          grep -Fq 'syncModule=="211"&&syncCc=="113"' "$UI"
          grep -Fq 'VERIFIED • MODULE 211 / APP 113' "$UI"
          grep -Fq 'APP ACTIVE • OBSERVE ONLY' "$UI"
          grep -Fq 'Focused workload:' "$UI"
          grep -Fq 'BLOCKED / OBSERVE ONLY' "$UI"
          grep -Fq 'gameVisible->"MULTIWINDOW"' "$UI"
          ! grep -Fq 'FOCUS GUARD' "$UI"

      - name: Source isolation
        run: |
          set -euo pipefail
          node isolation-check.js
          npm test

      - name: Android tests and release build
        working-directory: observer-next/android
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Sign and verify APK
        run: |
          set -euo pipefail
          mkdir -p out
          APK="out/DJAEGER-GAMING-Control-Center-v1.1.9-R89-CC113.apk"
          UNSIGNED="$(find observer-next/android/app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -n1)"
          test -n "$UNSIGNED"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n1)"
          SIGN_DIR="$RUNNER_TEMP/djaeger-r89-cc113-signing"
          mkdir -p "$SIGN_DIR"
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -storetype PKCS12             -keystore "$SIGN_DIR/djaeger-r89-cc113.p12"             -storepass "$PASS" -keypass "$PASS"             -alias djaegergaming -keyalg RSA -keysize 4096 -validity 3650             -dname 'CN=DJAEGER GAMING R89 CC113, O=DJAEGER, C=ID'

          ALIGNED="$RUNNER_TEMP/djaeger-r89-cc113-aligned.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$SIGN_DIR/djaeger-r89-cc113.p12" --ks-type PKCS12             --ks-key-alias djaegergaming             --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out "$APK" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/APKSIGNER_VERIFY.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/AAPT_BADGING.txt
          "$APKANALYZER" manifest debuggable "$APK" | tee out/APK_DEBUGGABLE.txt
          grep -q "package: name='com.djaeger.observer' versionCode='113' versionName='1.1.9-r89-cc113'" out/AAPT_BADGING.txt
          grep -qx 'false' out/APK_DEBUGGABLE.txt
          sha256sum "$APK" > out/DJAEGER-GAMING-Control-Center-v1.1.9-R89-CC113-SHA256SUMS.txt

      - name: Publish install artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete r89-cc113 --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create r89-cc113             out/DJAEGER-GAMING-Control-Center-v1.1.9-R89-CC113.apk             out/DJAEGER-GAMING-Control-Center-v1.1.9-R89-CC113-SHA256SUMS.txt             out/APKSIGNER_VERIFY.txt             out/AAPT_BADGING.txt             --target "$GITHUB_SHA"             --title "DJAEGER GAMING R89 Control Center 113"             --notes "Control Center VC113 for R89 app-focus MULTIWINDOW observe-only contract."

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-GAMING-R89-CC113
          path: out/*
          if-no-files-found: error
