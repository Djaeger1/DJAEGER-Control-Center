name: Build DJAEGER Control Center v0.12.1-r7
on:
  push:
    branches: [codex/v0.12.1-r3-root-vault]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Apply r4 baseline and r7 network intelligence patch
        run: |
          awk '/python3 - <<.PY./{f=1;next} f&&/^          PY$/{exit} f{sub(/^          /,"");print}' .github/workflows/build-control-center-r4.yml >/tmp/r4.py
          python3 /tmp/r4.py
          python3 - <<'PY'
          from pathlib import Path
          bp=Path('control-center-r2/app/build.gradle.kts'); b=bp.read_text().replace('versionCode = 12104','versionCode = 12107').replace('versionName = "0.12.1-r4"','versionName = "0.12.1-r7"'); bp.write_text(b)
          rp=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt'); r=rp.read_text()
          r=r.replace("echo __TEL__; tail -n 1 '$module/telemetry.csv' 2>/dev/null", "echo __TEL__; tail -n 1 '$module/telemetry.csv' 2>/dev/null\n        echo __FRAMEDEBUG__; cat '$persistent/frame_debug' 2>/dev/null\n        echo __NETWORK__; cat '$persistent/network_status' 2>/dev/null")
          r=r.replace('val csv=parseTelemetry(section("TEL","LIVE").trim())','val csv=parseTelemetry(section("TEL","FRAMEDEBUG").trim())\n        val frameDebug=section("FRAMEDEBUG","NETWORK").trim()\n        val networkRaw=section("NETWORK","LIVE").trim()\n        fun clean(v:String?):String{val x=v?.trim().orEmpty();return if(x.length>=2&&((x.first()==\'\\\'\'&&x.last()==\'\\\'\')||(x.first()==\'"\'&&x.last()==\'"\')))x.substring(1,x.length-1) else x}\n        fun kv(raw:String)=raw.lineSequence().mapNotNull{line->val p=line.indexOf(\'=\');if(p<=0)null else line.substring(0,p).trim() to clean(line.substring(p+1))}.toMap()\n        val frameMap=kv(frameDebug); val networkMap=kv(networkRaw)')
          r=r.replace('val now=System.currentTimeMillis()/1000;val age=now-tel.epoch','val now=System.currentTimeMillis()/1000;val age=now-tel.epoch\n        val frameAt=frameMap["SAMPLE_AT"]?.toLongOrNull()?:0L\n        val frameFresh=frameMap["CURRENT_FRAME_DATA"]=="VALID"&&frameMap["STAGE"]=="OK"&&frameMap["SESSION_ACTIVE"]=="1"&&frameAt>0&&(now-frameAt) in 0..15\n        val netAt=networkMap["UPDATED_AT"]?.toLongOrNull()?:0L\n        val networkFresh=networkMap["SESSION_ACTIVE"]=="1"&&netAt>0&&(now-netAt) in 0..30')
          r=r.replace('sampleFresh=liveFresh||csvFresh','sampleFresh=liveFresh||csvFresh||frameFresh')
          r=r.replace('active=rt["active"]?:"0",game=rt["game"]?:"NA",window=rt["window_mode"]?:"INACTIVE",controllerPid=rt["controller_pid"]?:"",predictorPid=rt["predictor_pid"]?:"",updated=rt["updated_at"]?.toLongOrNull()?:0,userMode=rt["user_mode"]?:"AUTO"','active=clean(rt["active"]).ifBlank{"0"},game=clean(rt["game"]).ifBlank{"NA"},window=clean(rt["window_mode"]).ifBlank{"INACTIVE"},controllerPid=clean(rt["controller_pid"]),predictorPid=clean(rt["predictor_pid"]),updated=clean(rt["updated_at"]).toLongOrNull()?:0,userMode=clean(rt["user_mode"]).ifBlank{"AUTO"}')
          # Surface network intelligence without allowing it to alter lifecycle authority.
          r=r.replace('notes = notes,', 'notes = notes + if(networkFresh) "\\nNETWORK • Ping ${networkMap[\"PING_CURRENT_MS\"]?:\"NA\"} ms • Avg ${networkMap[\"PING_AVG_MS\"]?:\"NA\"} ms • P95 ${networkMap[\"PING_P95_MS\"]?:\"NA\"} ms • Jitter ${networkMap[\"JITTER_MS\"]?:\"NA\"} ms • Loss ${networkMap[\"PACKET_LOSS_PCT\"]?:\"NA\"}% • ${networkMap[\"QUALITY\"]?:\"UNKNOWN\"}" else "\\nNETWORK • STALE/INACTIVE",')
          rp.write_text(r)
          p=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt'); s=p.read_text().replace('CONTROL CENTER • v0.12.1-r4 • ${state.moduleVersion} • MATCHED STACK • ROOT RESILIENT • KEY VAULT','CONTROL CENTER • v0.12.1-r7 • ${state.moduleVersion} • NETWORK INTELLIGENCE • KEY VAULT'); p.write_text(s)
          PY
      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign and audit
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-r7
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r7.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r7.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence.apk > output/SHA256SUMS.txt
          rm output/aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r7-NetworkIntelligence
          path: output/*
          if-no-files-found: error
          retention-days: 30
