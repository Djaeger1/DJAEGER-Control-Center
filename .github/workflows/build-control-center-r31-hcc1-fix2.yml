name: Build DJAEGER Control Center HCC1 FIX2 Jank Session
on:
  push:
    branches: [codex/r92-ui6-cog1-hcc1-fix2-jank-session]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}

      - name: Generate proven HCC1 FullSync plus FIX2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py; do
            python3 scripts/$s
          done

      - name: Exact FIX2 contract gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('control-center-r2')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          A=(root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'versionName = "0.12.1-r22-r92ui6-fix2-cog1-hcc1-fullsync-fix2"' in B
          assert 'versionCode = 12235' in B
          assert 'val jank:Double=-1.0' in R
          assert 'field(11).toDoubleOrNull()?:-1.0' in R
          assert 'runtimeTtlSec=if(activeClaim) 5L else 15L' in R
          assert 'jankText(s.telemetry.jank)' in M
          assert 'value>=0.0' in M
          assert 'val runtimeTtl=if(s.active=="1")5 else 15' in M
          # 0 is a valid value; negative is the unavailable sentinel.
          def jank(v): return f'{v:.1f}%' if v >= 0 else '—'
          assert jank(0.0) == '0.0%'
          assert jank(-1.0) == '—'
          assert 's["HERMES_HUMAN_COMFORT"]' in C
          assert 'hermesHumanComfort=mapped.hermesHumanComfort' in R
          start=M.index('@Composable fun Overview(s:RuntimeState)'); end=M.index('@Composable fun StatusCard',start); O=M[start:end]
          required=['ThoughtsCard(s);','Metric("FPS"','Metric("Frame"','Metric("Jank"','ThermalRow(s);','NetworkCard(s.network);','HermesCard(s);','HumanComfortHcc1Card(s);','ContextVNextCard(s);']
          pos=[O.index(x) for x in required]; assert pos==sorted(pos)
          snap=R[R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'):R.index('    suspend fun setUserMode',R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'))]
          assert 'ConsolidatedSnapshotReader' in snap
          for forbidden in ['/sys/','ProcessBuilder','djaeger-ai comfort','djaeger-ai feedback']:
              assert forbidden not in snap, forbidden
          assert 'SYSTEM_ALERT_WINDOW' not in A
          for forbidden in ['iptables','ip6tables',' force-stop','settings put','setprop','/sys/class/']:
              assert forbidden not in M
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+C+B)
          print('JANK_ZERO_VALID=PASS')
          print('JANK_UNAVAILABLE_SENTINEL=NEGATIVE')
          print('RUNTIME_TTL_ACTIVE=5s')
          print('RUNTIME_TTL_IDLE=15s')
          print('HCC1_FULLSYNC=PRESERVED')
          print('OVERVIEW_ORDER=PRESERVED')
          print('SINGLE_ATOMIC_ROOT_READ=PRESERVED')
          PY

      - name: Test and build release
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: APK safety scan
        run: |
          set -euo pipefail
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          test -n "$U"
          unzip -t "$U" >/tmp/apk_zip_test.txt
          strings "$U" > /tmp/apk_strings.txt || true
          ! grep -E 'iptables|ip6tables|force-stop|settings put|setprop' /tmp/apk_strings.txt
          echo APK_PRE_SIGN_SAFETY=PASS

      - name: Sign verify and hash
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-hcc1-fix2
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/hcc1-fix2.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center HCC1 FIX2, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/hcc1-fix2.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC-FIX2.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC-FIX2.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r22-r92UI6-FIX2-COG1-HCC1-FULLSYNC-FIX2.apk > output/APK_ZIP_TEST.txt
          sha256sum output/*.apk > output/SHA256SUMS.txt
          printf '%s\n' 'BASELINE=HCC1_FULLSYNC' 'FIX2_JANK_ZERO_VALID=YES' 'FIX2_JANK_UNAVAILABLE_SENTINEL=-1' 'FIX2_RUNTIME_TTL_ACTIVE_SEC=5' 'FIX2_RUNTIME_TTL_IDLE_SEC=15' 'MODULE_SESSION_FIX=FRESH_FRAME_LEASE_ALREADY_BOUND_ONLY' 'HCC1_FULLSYNC=PRESERVED' 'CONTROL_PATH=TYPED_DJAEGER_AI_ONLY' 'HARDWARE_AUTHORITY_CHANGE=NONE' 'NETWORK_GAME_TRAFFIC_CHANGE=NONE' > output/BUILD_CONTRACT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-HCC1-FULLSYNC-FIX2
          path: output/*
          if-no-files-found: error
