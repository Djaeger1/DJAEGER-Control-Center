name: Build DJAEGER Control Center v0.12.1-r9 Bug Health

on:
  push:
    branches:
      - codex/v0.12.1-r3-root-vault
    paths:
      - '.github/workflows/build-control-center-r9-bug-health.yml'
      - 'control-center-r2/**'
      - 'scripts/r9_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Apply r7 generated baseline
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines()
          marker = "          python3 - <<'PY'"
          try:
              start = next(i + 1 for i, line in enumerate(src) if line == marker)
              end = next(i for i in range(start, len(src)) if src[i] == '          PY')
          except StopIteration as exc:
              raise SystemExit('R7_BASELINE_HEREDOC_NOT_FOUND') from exc
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end]) + '\n'
          compile(body, '/tmp/r7.py', 'exec')
          Path('/tmp/r7.py').write_text(body)
          print('R7_BASELINE_EXTRACT=PASS')
          PY
          python3 /tmp/r7.py

      - name: Apply r9 atomic cutover and Bug Health integration
        run: |
          set -euo pipefail
          python3 scripts/r9_cutover_repository.py
          python3 scripts/r9_integrate_bug_health.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('control-center-r2/app/build.gradle.kts')
          s=p.read_text().replace('versionCode = 12107','versionCode = 12109').replace('versionName = "0.12.1-r7"','versionName = "0.12.1-r9"')
          p.write_text(s)
          m=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt')
          x=m.read_text().replace('CONTROL CENTER • v0.12.1-r7', 'CONTROL CENTER • v0.12.1-r9')
          m.write_text(x)
          PY

      - name: Architecture and regression gates
        run: |
          set -euxo pipefail
          R=control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt
          M=control-center-r2/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          grep -q 'versionName = "0.12.1-r9"' control-center-r2/app/build.gradle.kts
          grep -q 'ConsolidatedSnapshotReader' "$R"
          grep -q 'ConsolidatedRuntimeMapper' "$R"
          grep -q 'bugHealth=mapped.bugHealth' "$R"
          grep -q 'NetworkCard(s.network)' "$M"
          grep -q 'Bug & Health' "$M"
          grep -q 'BugNotifier' "$M"
          grep -q 'POST_NOTIFICATIONS' control-center-r2/app/src/main/AndroidManifest.xml
          for f in AtomicSnapshot.kt BugHealth.kt BugNotificationGate.kt BugNotifier.kt ConsolidatedSnapshotReader.kt ConsolidatedRuntimeMapper.kt; do test -f "control-center-r2/app/src/main/java/com/djaeger/controlcenter/$f"; done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('control-center-r2/app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          a=s.index('    suspend fun snapshot():RuntimeState'); b=s.index('    suspend fun setUserMode',a); snap=s[a:b]
          forbidden=['/sys/','thermal_zone','scaling_cur_freq','kgsl-3d0','iptables','nft ','ip route','setprop net.']
          bad=[x for x in forbidden if x in snap]
          if bad: raise SystemExit('FORBIDDEN_RECURRING_SNAPSHOT='+','.join(bad))
          for req in ['geminiKeyVaultStatus','addGeminiKeyToVault','selectGeminiKey','removeGeminiKey','authoritySyncStatus','kernelCapabilitySummary','maturityAudit']:
              if req not in s: raise SystemExit('LOST_REQUIRED_SYMBOL='+req)
          print('ARCHITECTURE_GATE=PASS')
          PY
          ! grep -R -E 'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}' control-center-r2/app/src control-center-r2/app/build.gradle.kts

      - name: Test and build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Sign verify and audit
        run: |
          set -euo pipefail
          mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-r9-bug-health
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r9.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r9.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r9-BugHealth.apk output/aligned.apk
          "$BT/apksigner" verify --verbose output/DJAEGER-Control-Center-v0.12.1-r9-BugHealth.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r9-BugHealth.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r9-BugHealth.apk > output/SHA256SUMS.txt
          rm output/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Control-Center-v0.12.1-r9-BugHealth
          path: output/*
          if-no-files-found: error
          retention-days: 30
