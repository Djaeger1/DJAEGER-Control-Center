name: DJAEGER AI RUNTIMEFIX Final Pair

on:
  push:
    branches: [djaeger-ai-adaptive-runtimefix-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: djaeger-ai-runtimefix-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  final-pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Patch release identity only
        run: |
          set -euo pipefail
          APP=observer-next/android/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt
          PUB=observer-next/module/bin/publisher.sh

          python3 - <<'PY'
          from pathlib import Path
          p=Path("observer-next/android/app/src/main/java/com/djaeger/controlcenter/MainActivity.kt")
          s=p.read_text()
          s=s.replace('syncModule=="206"&&syncCc=="107"', 'syncModule=="206"&&syncCc=="107"')
          s=s.replace('VERIFIED • MODULE 206 / APP 107', 'VERIFIED • MODULE 206 / APP 107')
          s=s.replace('DJAEGER AI Adaptive v1.1.3 RUNTIMEFIX • VERIFIED SYNC', 'DJAEGER AI Adaptive v1.1.3 RUNTIMEFIX • VERIFIED SYNC')
          p.write_text(s)

          p=Path("observer-next/module/bin/publisher.sh")
          s=p.read_text().replace('_expected_apk=107', '_expected_apk=107')
          p.write_text(s)
          PY

          ! grep -Fq 'syncModule=="206"&&syncCc=="107"' "$APP"
          ! grep -Fq 'VERIFIED • MODULE 206 / APP 107' "$APP"
          ! grep -Fq 'DJAEGER AI Adaptive v1.1.3 RUNTIMEFIX • VERIFIED SYNC' "$APP"
          grep -Fq 'syncModule=="206"&&syncCc=="107"' "$APP"
          grep -Fq 'VERIFIED • MODULE 206 / APP 107' "$APP"
          grep -Fq 'DJAEGER AI Adaptive v1.1.3 RUNTIMEFIX • VERIFIED SYNC' "$APP"
          grep -Fq '_expected_apk=107' "$PUB"

      - name: Source isolation and backend tests
        run: |
          set -euo pipefail
          node isolation-check.js
          npm test

          A=DJAEGER; B=WORK; C=HERMES; D=railway; E=relay; F=AUTO; G=STUDIO; H=YOUTUBE; I=SCHEDULER
          for q in "${A}-${B}" "${A}_${B}" "${A} ${B}" "${C}-${B}" "${C}_${B}" "${C} ${B}" "${D}-${E}" "${F}_${G}" "${H}_${I}"; do
            if grep -R -I -i -F --exclude-dir=.git --exclude=isolation-check.js "$q" observer-next; then
              echo "FOREIGN_SOURCE_RESIDUE=$q" >&2
              exit 1
            fi
          done

          test -d observer-next
          test ! -e observer-next/module/bin/agent_bus.sh
          test -e observer-next/module/bin/executor.sh
          grep -Fq 'MIGRATION_POLICY=EXPLICIT_KEY_ALLOWLIST_ONLY' observer-next/module/bin/migrate.sh
          grep -Fq 'RAW_LEGACY_FILES_IMPORTED=0' observer-next/module/bin/migrate.sh
          grep -Fq 'CLOUD_HARDWARE_AUTHORITY=NONE' observer-next/tests/module_contract_test.sh
          grep -Fq 'sync-request' observer-next/module/bin/observerctl.sh
          grep -Fq 'PAIR_VERIFIED' observer-next/module/bin/publisher.sh
          grep -Fq 'RATE_LIMIT_COOLDOWN=1800' observer-next/module/bin/gemini_reasoner.sh
          grep -Fq 'VISIBLE_GAME_MULTIWINDOW' observer-next/module/bin/observer.sh
          grep -Fq 'cloud_probe' observer-next/module/bin/hermes_adapter.sh

          for f in observer-next/module/*.sh observer-next/module/bin/*.sh; do
            [ "$f" = observer-next/module/bin/executor.sh ] && continue
            ! grep -Eq 'tee[[:space:]]+/sys/|>[[:space:]]*/sys/' "$f"
          done

      - name: Shell syntax
        run: |
          set -euo pipefail
          for f in observer-next/module/*.sh observer-next/module/bin/*.sh; do
            bash -n "$f"
          done

      - name: Module contract and fake-sysfs rollback tests
        run: bash observer-next/tests/module_contract_test.sh

      - name: Android unit tests and release build
        working-directory: observer-next/android
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Package final signed pair
        run: |
          set -euo pipefail
          mkdir -p out
          cd observer-next/module
          zip -qr ../../out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip .
          cd ../..

          UNSIGNED="$(find observer-next/android/app/build/outputs/apk/release -type f -name '*unsigned.apk' | head -n1)"
          test -n "$UNSIGNED"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n1)"
          SIGN_DIR="$RUNNER_TEMP/djaeger-ai-final-signing"
          mkdir -p "$SIGN_DIR"
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$PASS"
          keytool -genkeypair -noprompt -storetype PKCS12             -keystore "$SIGN_DIR/djaeger-ai.p12"             -storepass "$PASS" -keypass "$PASS"             -alias djaegerai -keyalg RSA -keysize 4096 -validity 3650             -dname 'CN=DJAEGER AI, O=DJAEGER, C=ID'

          ALIGNED="$RUNNER_TEMP/djaeger-ai-final-aligned.apk"
          APK="out/DJAEGER-AI-Adaptive-v1.1.3-runtimefix-FINAL.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$SIGN_DIR/djaeger-ai.p12" --ks-type PKCS12             --ks-key-alias djaegerai             --ks-pass "pass:$PASS" --key-pass "pass:$PASS"             --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true             --out "$APK" "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee out/APKSIGNER_VERIFY.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee out/AAPT_BADGING.txt
          "$APKANALYZER" manifest debuggable "$APK" | tee out/APK_DEBUGGABLE.txt
          unzip -t "$APK" > out/APK_ZIP_TEST.txt
          unzip -t out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip > out/MODULE_ZIP_TEST.txt
          unzip -l out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip > out/MODULE_CONTENTS.txt

          grep -q "package: name='com.djaeger.observer' versionCode='107' versionName='1.1.3-runtimefix'" out/AAPT_BADGING.txt
          grep -qx 'false' out/APK_DEBUGGABLE.txt
          grep -Eq 'bin/executor\.sh' out/MODULE_CONTENTS.txt
          grep -Eq 'bin/railway_bridge\.sh' out/MODULE_CONTENTS.txt
          grep -Eq 'bin/migrate\.sh' out/MODULE_CONTENTS.txt
          grep -Eq 'uninstall\.sh' out/MODULE_CONTENTS.txt
          ! grep -Eq 'agent_bus\.sh' out/MODULE_CONTENTS.txt

          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/publisher.sh | grep -Fq '_expected_apk=107'
          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/migrate.sh | grep -Fq 'MIGRATION_SCHEMA=9'
          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/migrate.sh | grep -Fq 'gemini_keys.vault'
          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/migrate.sh | grep -Fq 'HERMES_SHARED_TOKEN'
          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/migrate.sh | grep -Fq 'hermes/neuron_budget.env'

          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/observer.sh | grep -Fq 'sdm-skin-therm-usr'
          ! unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/observer.sh | grep -Fq 'SKIN=$(temp_c "$(thermal_by_type'
          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/frame_observer.sh | grep -Fq 'VALID_PRESENTATION_LAYER'
          unzip -p out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip bin/migrate.sh | grep -Fq 'LEGACY_BACKUPS_TERMUX_DOWNLOAD'

          cd out
          sha256sum DJAEGER-AI-Adaptive-v1.1.3-runtimefix-FINAL.apk DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip > SHA256SUMS.txt
          printf '%s\n'             'STATUS=FINAL_PAIR_BUILD_VERIFIED_OFFLINE'             'PAIR=MODULE_206_APK_107'             'VERSION=1.1.3-runtimefix'             'CREDENTIAL_RECOVERY=LEGACY_BACKUP_SCAN_PLUS_RAW_4_GEMINI_PLUS_HERMES_PLUS_LOCAL_NEURON'             'GEMINI_SECRET_VALUES=NEVER_LOGGED'             'HERMES_SECRET_VALUES=NEVER_LOGGED'             'CLOUD_HARDWARE_AUTHORITY=NONE'             'SYSFS_AUTHORITY=LOCAL_GATED_EXECUTOR_ONLY'             'LIVE_DEVICE_VALIDATION=REQUIRED_AFTER_INSTALL'             > BUILD_REPORT.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-AI-Adaptive-RUNTIMEFIX-v1.1.3-FINAL
          path: |
            out/DJAEGER-AI-Adaptive-v1.1.3-runtimefix-FINAL.apk
            out/DJAEGER-AI-Adaptive-Module-v1.1.3-runtimefix-FINAL.zip
            out/SHA256SUMS.txt
            out/BUILD_REPORT.txt
            out/APKSIGNER_VERIFY.txt
            out/AAPT_BADGING.txt
            out/APK_DEBUGGABLE.txt
            out/APK_ZIP_TEST.txt
            out/MODULE_ZIP_TEST.txt
            out/MODULE_CONTENTS.txt
          if-no-files-found: error
