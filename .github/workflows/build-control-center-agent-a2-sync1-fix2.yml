name: Build DJAEGER Control Center Agent A2 SYNC2 FIX1
on:
  push:
    branches: [codex/r92-agent-a2-sync1-fix2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Generate Agent A2 SYNC2 FIX1 source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines()
          marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker)
          end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py r34_hcc1_fix4_authority_semantic_sync.py r35_agent_a2_dualbrain_sync.py r36_agent_a2_sync1_matched_pair.py r37_agent_a2_sync1_runtime_hardening.py r38_agent_a2_sync1_semantic_runtime_fix2.py r39_agent_a2_strategy_result_binding_fix2.py r40_agent_a2_keyvault_slot_mapping_fix2.py r41_agent_a2_sync2_fix1_overview_runtime.py; do
            python3 scripts/$s
          done

      - name: Exact SYNC2 FIX1 gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('control-center-r2')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          A=(root/'app/src/main/AndroidManifest.xml').read_text()
          assert 'versionCode = 12243' in B
          assert 'versionName = "0.12.2-agent-a2-sync2-fix1"' in B
          for x in ['AI AGENT A2 • FINAL AUTHORITY','THIRD_BRAIN','DUALBRAIN-AGENT-A2-SYNC2-FIX1','REASONING ONLY • AI AGENT A2 OWNS DECISION + EXECUTION','No direct hardware writes from Control Center','sampleSessionKey','runtimeStateStale(s)','BoxWithConstraints','maxWidth<520.dp','Gemini: $provider • $geminiState','Execution: $executionLine','Failure: $agentReason']:
              assert x in M,x
          for x in ['LOCAL_AI','LOCAL_LEARNED','LOCAL_BASELINE','LOCAL VALIDATOR/TYPED EXECUTOR','STANDBY_GEMINI_ONLINE','READ-ONLY application','GEMINI INTELLIGENCE HUMAN VIEW','bridgeOp="SAVE_KEY"']:
              assert x not in M,x
          for x in ['reasoning=mapped.reasoning','resync=mapped.resync','execution=mapped.execution','policyContext=mapped.policyContext','attribution=mapped.attribution','val sr=AtomicSnapshot.keyValues(mapped.strategyResult)']:
              assert x in R,x
          assert 'val httpCode=envField(s.geminiHttp,"HTTP_CODE")' in M
          assert 'val agentState=envField(s.brain,"AGENT_STATE")' in M
          assert 'val execStatus=envField(s.execution,"EXECUTION_STATUS")' in M
          start=M.index('@Composable fun Overview(s:RuntimeState)'); end=M.index('@Composable fun StatusCard',start); O=M[start:end]
          order=['ThoughtsCard(s);','AgentA2Card(s);','HermesCard(s);']; pos=[O.index(x) for x in order]; assert pos==sorted(pos)
          snap=R[R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'):R.index('    suspend fun setUserMode',R.index('    suspend fun snapshot():RuntimeState=withContext(Dispatchers.IO){'))]
          assert 'ConsolidatedSnapshotReader' in snap
          assert 'while true; do cat /data/adb/djaeger_ai/fast_telemetry' not in R
          assert 'SYSTEM_ALERT_WINDOW' not in A
          assert not re.search(r'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}',M+R+B)
          print('SYNC2_FIX1_RESPONSIVE_MULTIWINDOW=PASS')
          print('SYNC2_FIX1_HTTP_GEMINI_BINDING=PASS')
          print('SYNC2_FIX1_AGENT_STATE_BINDING=PASS')
          print('SYNC2_FIX1_EXECUTION_BINDING=PASS')
          print('SYNC2_FIX1_EXACT_TWO_BRAINS=PASS')
          PY

      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace

      - name: Align sign verify SYNC2 FIX1 APK
        run: |
          set -euo pipefail
          mkdir -p output
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -n "$U"
          "$BT/zipalign" -p -f 4 "$U" output/DJAEGER-Control-Center-Agent-A2-SYNC2-FIX1-aligned-unsigned.apk
          PASS="$(openssl rand -hex 24)"
          ALIAS=djaeger-agent-a2-sync2-fix1-ci
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/sync2.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER Agent A2 SYNC2 FIX1, O=DJAEGER, C=ID'
          "$BT/apksigner" sign --ks /tmp/sync2.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.2-Agent-A2-SYNC2-FIX1.apk output/DJAEGER-Control-Center-Agent-A2-SYNC2-FIX1-aligned-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.2-Agent-A2-SYNC2-FIX1.apk > output/APK_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.2-Agent-A2-SYNC2-FIX1.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.2-Agent-A2-SYNC2-FIX1.apk > output/SHA256.txt
          printf '%s\n' 'MATCHED_MODULE=GOLDEN1_RC1_DUALBRAIN_AGENT_A2_SYNC2_FIX1' 'MODULE_VERSION_CODE=129615' 'CONTROL_CENTER_VERSION=0.12.2-agent-a2-sync2-fix1' 'VERSION_CODE=12243' 'BRAINS=GEMINI,HERMES_H2' 'FINAL_OWNER=AI_AGENT_A2' 'THIRD_BRAIN=NONE' 'FIXES=kernel_clamp_runtime_pair,http_gemini_binding,agent_state_binding,execution_binding,responsive_multiwindow,concise_thought,session_isolation,keyvault_mapping' 'SIGNER=EPHEMERAL_CI_NOT_STABLE_BASELINE' > output/BUILD_CONTRACT.txt
          rm -f /tmp/sync2.p12

      - name: Publish APK and generated source audit
        run: |
          set -euo pipefail
          rm -rf dist-sync2-fix1 audit-sync2-fix1
          mkdir -p dist-sync2-fix1 audit-sync2-fix1/src
          cp output/DJAEGER-Control-Center-v0.12.2-Agent-A2-SYNC2-FIX1.apk dist-sync2-fix1/
          cp output/APK_VERIFY.txt output/APK_ZIP_TEST.txt output/SHA256.txt output/BUILD_CONTRACT.txt dist-sync2-fix1/
          cp -a control-center-r2/app/src/main/java/com/djaeger/controlcenter/. audit-sync2-fix1/src/
          cp control-center-r2/app/build.gradle.kts audit-sync2-fix1/
          cp control-center-r2/app/src/main/AndroidManifest.xml audit-sync2-fix1/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist-sync2-fix1 audit-sync2-fix1
          git commit -m 'Publish Agent A2 SYNC2 FIX1 and generated source [skip ci]'
          git push origin HEAD:codex/r92-agent-a2-sync1-fix2
