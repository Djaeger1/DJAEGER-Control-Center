name: Build DJAEGER Control Center HK1 SYSFS1 CCSYNC1
on:
  push:
    branches: [codex/rebuild3-hk1-sysfs1-ccsync1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Restore exact vc12257 source then apply CCSYNC1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py r20_runtime_contract_sync.py r21_runtime_bugfix.py r22_gemini_first_thoughts.py r22_r92_thoughts_strategy_ui.py r22_r92_module_sync_ui2.py r23_h2_ui5_hermes_card.py r24_h2_rt3_ui6_semantic_evidence_sync.py r25_ui6_fix1_gemini_cloud_truth.py r26_ui6_fix2_runtime_contract_mapping.py r27_ui6_ctx1_full_sync.py r28_ui6_cog1_full_suite.py r29_ui6_network_below_thought.py r30_ui6_hcc1_full_sync.py r31_hcc1_fix2_jank_session.py r32_hcc1_fix4_baseline_single_snapshot.py r33_hcc1_fix4_freshness_unified.py; do python3 scripts/$s; done
          python3 scripts/r34_rebuild3_agent_full_hardware_truth.py
          python3 scripts/r35_rebuild3_lang2_mwfix1.py
          python3 scripts/r36_rebuild3_lang3_math1_sync1.py
          python3 scripts/r37_sync2_session_truth_ui_order.py
          python3 scripts/r38_mwfix2_sync3.py
          python3 scripts/r39_attr1_sync4.py
          cp -a control-center-r2 /tmp/control-center-sync4
          python3 scripts/r40_hk1_sysfs1_ccsync1.py
      - name: CCSYNC1 source and preservation gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('control-center-r2'); old=Path('/tmp/control-center-sync4')
          M=(root/'app/src/main/java/com/djaeger/controlcenter/MainActivity.kt').read_text()
          R=(root/'app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt').read_text()
          C=(root/'app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt').read_text()
          B=(root/'app/build.gradle.kts').read_text()
          assert 'versionCode = 12258' in B and '0.12.1-rebuild3-hk1-sysfs1-ccsync1' in B
          assert 'REBUILD3_LANG3_MWFIX2_ATTR1_MATH1_HK1_SYSFS1_CCSYNC1' in M
          assert 'syncModule=="129631"&&syncCc=="12258"' in M
          for x in ['HERMES_KERNEL1','AGENT_SYSFS1_CAPABILITY','AGENT_SYSFS1_EXECUTION']: assert x in C
          assert 'KernelAgentSyncCard(s);HermesCard(s)' in M
          for x in ['ThoughtsCard(s)','NetworkCard(s.network)','StrategyCard(s)','HumanComfortHcc1Card(s)','ContextVNextCard(s)','MemoryVNextCard(s)','ReasoningV2Card(s)','SkillsVNextCard(s)','LearningResearchV2Card(s)']: assert x in M
          assert 'AGENT_WINNER' not in M and 'LOCAL AI' not in M
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before={p.relative_to(old).as_posix():h(p) for p in old.rglob('*') if p.is_file()}
          after={p.relative_to(root).as_posix():h(p) for p in root.rglob('*') if p.is_file()}
          changed=sorted(k for k in before.keys()&after.keys() if before[k]!=after[k])
          allowed=sorted(['app/build.gradle.kts','app/src/main/java/com/djaeger/controlcenter/ConsolidatedRuntimeMapper.kt','app/src/main/java/com/djaeger/controlcenter/DjaegerRepository.kt','app/src/main/java/com/djaeger/controlcenter/MainActivity.kt'])
          assert changed==allowed,(changed,allowed)
          assert set(before)==set(after)
          print('CCSYNC1_MATCHED_CONTRACT=PASS')
          print('CCSYNC1_EXISTING_UI_PRESERVATION=PASS')
          print('CCSYNC1_ONLY_FOUR_SOURCE_FILES_CHANGED=PASS')
          print('CCSYNC1_NEW_RECURRING_ROOT_READS=0')
          PY
      - name: Unit tests and release build
        working-directory: control-center-r2
        run: |
          gradle :app:testReleaseUnitTest --stacktrace
          gradle :app:assembleRelease --stacktrace
      - name: Sign verify and prepare audit
        run: |
          set -euo pipefail
          rm -rf dist-hk1-sysfs1-ccsync1 audit-hk1-sysfs1-ccsync1 output-hk1-sysfs1-ccsync1
          mkdir -p dist-hk1-sysfs1-ccsync1 audit-hk1-sysfs1-ccsync1/src output-hk1-sysfs1-ccsync1
          U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 "$U" output-hk1-sysfs1-ccsync1/aligned.apk
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-hk1-sysfs1-ccsync1-ci
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore /tmp/ccsync1.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 3650 -dname 'CN=DJAEGER HK1 SYSFS1 CCSYNC1, O=DJAEGER, C=ID'
          APK=dist-hk1-sysfs1-ccsync1/DJAEGER-Control-Center-v0.12.1-REBUILD3-HK1-SYSFS1-CCSYNC1.apk
          "$BT/apksigner" sign --ks /tmp/ccsync1.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out "$APK" output-hk1-sysfs1-ccsync1/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" > dist-hk1-sysfs1-ccsync1/APK_VERIFY.txt
          unzip -t "$APK" > dist-hk1-sysfs1-ccsync1/APK_ZIP_TEST.txt
          sha256sum "$APK" > dist-hk1-sysfs1-ccsync1/SHA256.txt
          printf '%s\n' \
            'MATCHED_MODULE_VERSION_CODE=129631' \
            'CONTROL_CENTER_VERSION_CODE=12258' \
            'CONTROL_CENTER_VERSION_NAME=0.12.1-rebuild3-hk1-sysfs1-ccsync1' \
            'CONTRACT=REBUILD3_LANG3_MWFIX2_ATTR1_MATH1_HK1_SYSFS1_CCSYNC1' \
            'HERMES_KERNEL=KERNEL1' \
            'AGENT_SYSFS=SYSFS1' \
            'ROOT_AUTHORITY_OWNER=AI_AGENT' \
            'SYSFS_OWNER=AI_AGENT' \
            'SNAPSHOT_SOURCE=ATOMIC_CC_SNAPSHOT' \
            'EXISTING_UI_PRESERVED=YES' \
            'NEW_RECURRING_ROOT_READS=0' > dist-hk1-sysfs1-ccsync1/BUILD_CONTRACT.txt
          cp -a control-center-r2/app/src/main/java/com/djaeger/controlcenter/. audit-hk1-sysfs1-ccsync1/src/
          cp control-center-r2/app/build.gradle.kts audit-hk1-sysfs1-ccsync1/
          cp control-center-r2/app/src/main/AndroidManifest.xml audit-hk1-sysfs1-ccsync1/
      - name: Upload CCSYNC1 artifact (optional mirror)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: djaeger-control-center-hk1-sysfs1-ccsync1
          path: dist-hk1-sysfs1-ccsync1/
          if-no-files-found: error
          retention-days: 30
      - name: Publish outputs directly to branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist-hk1-sysfs1-ccsync1 audit-hk1-sysfs1-ccsync1
          git commit -m 'Publish HK1 SYSFS1 CCSYNC1 Control Center [skip ci]'
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin codex/rebuild3-hk1-sysfs1-ccsync1
          git push origin HEAD:codex/rebuild3-hk1-sysfs1-ccsync1
