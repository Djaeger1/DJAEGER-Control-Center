name: Build DJAEGER Charge Control v2

on:
  push:
    branches: [ build-djaeger-charge-control-v2 ]
    paths:
      - 'charge-control-build/**'
      - '.github/workflows/build-charge-control-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static contract checks
        run: |
          ! grep -R "/sys/class/power_supply" charge-control-build/app/src/main/java
          grep -R "/data/adb/modules/djaeger_autocut_charge/system/bin/djaeger-charge-control" charge-control-build/app/src/main/java
          grep -R "MANUAL_BYPASS" charge-control-build/app/src/main/java
          grep -R "EXTRA_TEMPERATURE" charge-control-build/app/src/main/java
          grep -R "ACTION_BYPASS" charge-control-build/app/src/main/java
          grep -R "ACTION_AUTO" charge-control-build/app/src/main/java

      - name: Build APK
        run: |
          cd charge-control-build
          gradle :app:assembleDebug --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/DJAEGER-Charge-Control-v2.0-PocoX5.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJAEGER-Charge-Control-v2.0-PocoX5
          path: dist/DJAEGER-Charge-Control-v2.0-PocoX5.apk
