name: Build DJAEGER Control Center v0.12.1-r19
on:
  push:
    branches: [codex/v0.12.1-r19-thoughts-local-memory]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Generate r19
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/build-control-center-r7-layout-final.yml').read_text().splitlines(); marker="          python3 - <<'PY'"
          start=next(i+1 for i,x in enumerate(src) if x==marker); end=next(i for i in range(start,len(src)) if src[i]=='          PY')
          Path('/tmp/r7.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in src[start:end])+'\n')
          PY
          python3 /tmp/r7.py
          for s in r9_cutover_repository.py r9_integrate_bug_health.py r10_integrate_manual_refresh.py r10_1_idle_semantics.py r10_2_freshness_semantics.py r11_surgical_remove_ui.py r12_user_design_additive.py r13_complete_user_design.py r14_screenshot_bugfix.py r15_runtime_contract_autorotate.py r16_session_frame_plan_fix.py r17_four_key_pool_bridge.py r18_fast_telemetry_ui.py r19_thoughts_local_memory.py; do python3 scripts/$s; done
      - name: Test and build
        working-directory: control-center-r2
        run: gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - name: Sign verify
        run: |
          set -euo pipefail; mkdir -p output signing
          PASS="$(openssl rand -hex 24)"; ALIAS=djaeger-control-center-r19
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore signing/r19.p12 -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 9125 -dname 'CN=DJAEGER Control Center, O=DJAEGER, C=ID'
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"; U="$(find control-center-r2/app/build/outputs/apk/release -name '*unsigned.apk' | head -1)"
          "$BT/zipalign" -p -f 4 "$U" output/aligned.apk
          "$BT/apksigner" sign --ks signing/r19.p12 --ks-type PKCS12 --ks-key-alias "$ALIAS" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --v2-signing-enabled true --v3-signing-enabled true --out output/DJAEGER-Control-Center-v0.12.1-r19.apk output/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs output/DJAEGER-Control-Center-v0.12.1-r19.apk | tee output/APKSIGNER_VERIFY.txt
          unzip -t output/DJAEGER-Control-Center-v0.12.1-r19.apk > output/APK_ZIP_TEST.txt
          sha256sum output/DJAEGER-Control-Center-v0.12.1-r19.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: DJAEGER-Control-Center-v0.12.1-r19, path: 'output/*', if-no-files-found: error}
