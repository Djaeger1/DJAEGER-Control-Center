name: Build DJAEGER Remote isolated

on:
  push:
    branches:
      - ci-djaeger-remote-20260923
    paths:
      - '.github/workflows/djaeger-remote-build.yml'
  workflow_dispatch:

# sdk discovery retry 5
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Reconstruct DJAEGER Remote source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf djaeger-remote-build
          mkdir -p djaeger-remote-build
          cat ci/djaeger-remote-src.b64.* | base64 -d > /tmp/djaeger-remote-src.zip
          unzip -q /tmp/djaeger-remote-src.zip -d djaeger-remote-build
          test -f djaeger-remote-build/settings.gradle.kts
          test -f djaeger-remote-build/app/build.gradle.kts
          sha256sum /tmp/djaeger-remote-src.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK from runner
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print || true
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print | head -n1)"
          test -n "$SDKMANAGER"
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed Controller and Agent
        working-directory: djaeger-remote-build
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleControllerRelease :app:assembleAgentRelease --stacktrace --no-daemon

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euxo pipefail
          find djaeger-remote-build/app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;
          test -n "$(find djaeger-remote-build/app/build/outputs/apk/controller/release -type f -name '*.apk' -print -quit)"
          test -n "$(find djaeger-remote-build/app/build/outputs/apk/agent/release -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: djaeger-remote-apks
          if-no-files-found: error
          retention-days: 7
          path: |
            djaeger-remote-build/app/build/outputs/apk/controller/release/*.apk
            djaeger-remote-build/app/build/outputs/apk/agent/release/*.apk
