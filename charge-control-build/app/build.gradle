plugins {
    id 'com.android.application'
}

android {
    namespace 'com.djaeger.chargecontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.djaeger.chargecontrol'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
