plugins {
    id 'com.android.application'
}

android {
    namespace 'com.djaeger.autocutmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.djaeger.autocutmonitor'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
    }
}
